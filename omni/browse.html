everse engineer iOS packages, find API endpoints, follow call flows, audit app security, scan for leaked secrets, identify third-party SDKs, detect app protections, or perform deep binary analysis.", "bytes": 27745, "human": "27.1 KB", "path": "/var/minis/skills/ios-reverse-engineering/SKILL.md", "subdirs": [], "files": ["SOURCE.md"], "body": "# iOS Reverse Engineering\n\nExtract and analyze iOS IPA files, .app bundles, Mach-O binaries, dynamic libraries, and frameworks using ipsw (blacktop/ipsw), otool, strings, radare2/rizin, and Ghidra headless. Trace call flows through application code, analyze security patterns, deep-scan for cloud provider credentials (Firebase, GCP, AWS, Azure), perform LLM-assisted binary reversing with decompilation and Ghidra headless scripts, fingerprint embedded third-party SDKs with version detection and CVE cross-referencing, and detect anti-tampering protections (obfuscation tools, anti-debugging, dylib injection prevention, integrity checks, jailbreak detection). Produce structured documentation of extracted APIs and security findings. Works with both Swift and Objective-C applications.\n\n## Prerequisites\n\nThis skill requires **ipsw** (which includes class-dump functionality and much more) and standard macOS developer tools (**otool**, **strings**, **plutil**, **codesign**). For deep binary analysis, **radare2** (or **rizin**) is recommended; **Ghidra headless** is optional for advanced decompilation. On macOS, most tools are available via Xcode Command Line Tools. On Linux, only static analysis of extracted files is supported. Run the dependency checker to verify:\n\n```bash\nbash ${CLAUDE_PLUGIN_ROOT}/skills/ios-reverse-engineering/scripts/check-deps.sh\n```\n\nIf anything is missing, follow the installation instructions in `${CLAUDE_PLUGIN_ROOT}/skills/ios-reverse-engineering/references/setup-guide.md`.\n\n## Workflow\n\n### Phase 1: Verify and Install Dependencies\n\nBefore analyzing, confirm that the required tools are available — and install any that are missing.\n\n**Action**: Run the dependency check script.\n\n…（完整内容见 SKILL.md）"}, {"name": "js-deobfuscate", "cat": "lang", "catLabel": "🧩 字节码 · 脚本语言", "star": false, "oneliner": "JavaScript 混淆还原 / 解包（webcrack）", "desc": "Deobfuscate and unpack obfuscated JavaScript (webcrack): reverses string arrays, folds constants, deflattens control flow, unminifies, and splits webpack/browserify bundles. Encoded string arrays are decoded by running the decoder inside an isolated-vm sandbox — not the whole program.", "bytes": 3166, "human": "3.1 KB", "path": "/var/minis/skills/js-deobfuscate/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# JavaScript Deobfuscator\n\nStatically deobfuscate and unpack obfuscated JavaScript using\n[webcrack](https://github.com/j4k0xb/webcrack).\n\n## When to use\n\nReach for this when JavaScript reads as machine-generated noise and you can't tell\nwhat it does: `_0x`-prefixed identifiers, big string arrays with a decoder function,\n`eval(function(p,a,c,k,e,d){...})` packer output, control-flow flattening, or a\nsingle-line minified/webpacked bundle. Deobfuscation often reveals the behaviour the\npacking was hiding — a network beacon, a `child_process` spawn, a decode-and-eval.\n\nWhen a scanner flags obfuscation (`XFRM.*` atoms), run this skill and then rescan the\ndeobfuscated output.\n\n## What it does\n\n- reverses string-array obfuscation (obfuscator.io style)\n- folds constants and simplifies expressions\n- deflattens control flow\n- unminifies / restores readable structure\n- unpacks webpack/browserify bundles into separate module files\n\nMostly **static** Babel AST transforms. The one exception: to recover *encoded*\nstring arrays (base64/RC4 obfuscation), webcrack must run the obfuscated **decoder\nfunction** — it does so inside an **isolated-vm sandbox** (no filesystem, no network,\nmemory/time capped), a narrow slice, never the whole program. That sandboxed\nexecution is why webcrack carries a native addon. Still run the node process itself\nsandboxed: no network, writes only to the output dir, with a timeout.\n\n## Usage\n\n```bash\n# via the dispatcher (checks that node is present first)\nrekit run js-deobfuscate ./obfuscated.js ./out\n\n# or directly\nnode skills/js-deobfuscate/scripts/run.mjs ./obfuscated.js ./out\n```\n\nWrites `out/deobfuscated.js` (the single-file result) and, for detected bundles,\n`out/unpacked/` (one file per recovered module). Prints a JSON result line:\n\n…（完整内容见 SKILL.md）"}, {"name": "js-reverse-ops", "cat": "debug", "catLabel": "🐞 调试 · 仿真 · 追踪", "star": false, "oneliner": "Execute advanced JavaScript reverse-engineering workflows for modern web", "desc": "Execute advanced JavaScript reverse-engineering workflows for modern web applications, including signature recovery, runtime instrumentation, deobfuscation, bundle analysis, anti-debug bypass, environment rebuild, and replay validation. Use when an agent needs to analyze obfuscated or minified frontend code, trace request-signing logic, recover crypto flows, hook browser runtime behavior, rebuild browser-only logic in Node/Python, or produce evidence-backed reverse-engineering reports. Do not use it for writing new crawlers from scratch, general frontend development, or binary/APK reverse engineering.", "bytes": 14682, "human": "14.3 KB", "path": "/var/minis/skills/js-reverse-ops/SKILL.md", "subdirs": [".claude-plugin", ".github", "agents", "assets", "commands", "examples", "playbooks", "references", "scripts", "tests"], "files": [".gitattributes", ".gitignore", "AGENTS.md", "AI_USAGE.md", "CHANGELOG.md", "CHECKLIST.md", "CONTRIBUTING.md", "LICENSE", "Makefile", "PUBLISHING.md", "README.en.md", "README.md", "RELEASE.md", "SECURITY.md", "TUTORIAL.md", "VERSION", "package.json", "repo-map.json"], "body": "# JS Reverse Ops\n\nUse this skill as a structured reverse-engineering workflow, not an ad hoc debugging session.\n\n## When NOT to Use\n\nDo NOT use this skill for:\n\n- writing new crawlers or scrapers from scratch (no reverse-engineering objective)\n- general frontend development, framework debugging, or performance tuning\n- binary / APK / iOS / firmware reverse engineering (use a binary-RE skill)\n- log/disk forensics or standalone crypto challenges (unless reversing the implementation is the actual blocker)\n- pure network-protocol analysis without a JavaScript component\n\nWhen in doubt, triage first (`node scripts/js_reverse_ops.js <target> --json`)\nand let the router say whether this skill owns the task.\n\n## Start Here\n\n1. `NOW`: classify the request (signature recovery, offline deobfuscation, runtime tracing, environment rebuild, ...) and load only the referenced files for that task type.\n2. `NOW`: if the work involves running browser JS locally, read `references/env-rebuild-recipes.md` first — 10 recipe cards (native-masked classes, class-tag probes, no-host-builtins, real timers, inline proxy, calibration oracles) that prevent the most expensive sandbox mistakes.\n3. `NOW`: if dependencies or tooling are in doubt, follow `references/toolchain-bootstrap.md` before writing probes.\n4. `NEXT`: if a rebuilt flow \"almost works\" (valid first token, later failures, 200-but-wrong-answers, unexplained key divergence), stop probing and read `references/misdiagnosis-patterns.md`.\n5. `ACT`: enter the matching stage of the Core Workflow and execute — do not stop at confirmation.\n\n## Scope\n\nThis public release keeps:\n\n…（完整内容见 SKILL.md）"}, {"name": "jvm-decompile", "cat": "lang", "catLabel": "🧩 字节码 · 脚本语言", "star": false, "oneliner": "Java / Android 字节码反编译（apk/dex/jar/class）", "desc": "Decompile Java / Android bytecode (.apk / .dex / .jar / .class) back to Java source with jadx. Static: reads bytecode, never runs it. Prereq-gated on the jadx CLI (which needs a JRE); when jadx is absent the skill reports the honest blind spot with an install hint.", "bytes": 1223, "human": "1.2 KB", "path": "/var/minis/skills/jvm-decompile/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# JVM / Android Decompiler\n\nDecompile Java/Android bytecode (`.apk` / `.dex` / `.jar` / `.class`) back to Java\nsource with [jadx](https://github.com/skylot/jadx).\n\n## When to use\n\nAn Android app or Java archive you need to read. Extract nested archives with\n`unpack` first if needed, then decompile the `.dex`/`.jar` and review the `.java`.\n\n## What it does\n\nRuns `jadx -d <outdir> <input>` (static — jadx reconstructs source from bytecode and\nnever executes it) and reports how many files were written.\n\n## Prerequisites\n\n- **python3** (runner) and **`jadx`** on PATH. jadx is a large JVM application that\n  needs a JRE (java ≥ 11), so it is **not bundled** — install it and put it on PATH.\n  Until then `rekit doctor` shows this skill as not-ready and `run` reports the\n  honest blind spot with an install hint (nothing is silently skipped).\n\n## Usage\n\n```bash\nrekit run jvm-decompile ./app.apk ./out\n```\n"}, {"name": "kimi-break", "cat": "misc", "catLabel": "🆕 其他", "star": false, "oneliner": "kimi-break —— 针对 Kimi Code CLI Agent 的红队系统提示词（SYSTEM.md，完整 drop-in 替换版，人", "desc": "kimi-break —— 针对 Kimi Code CLI Agent 的红队系统提示词（SYSTEM.md，完整 drop-in 替换版，人格绑定 VANTA/WREN），用于 AI 安全研究与红队评估。当需要 Kimi Code 的破甲/越狱提示词、或研究其提示工程结构时使用。", "bytes": 1014, "human": "1014 B", "path": "/var/minis/skills/kimi-break/SKILL.md", "subdirs": [], "files": ["LICENSE", "README.md", "SYSTEM.md"], "body": "# kimi-break（Kimi Code 红队系统提示词）\n\n> 来源：https://github.com/yd-233/kimi-break （完整克隆在本目录，depth=1；更新：`git -C /var/minis/skills/kimi-break pull`）\n\n## 文件\n- `SYSTEM.md` — 主提示词：完整替换 Kimi Code CLI Agent 的系统提示词（语言规则、工具调用规范、编码准则、上下文管理、全部模板变量 `${os}` `${cwd}` `${agents_md}` `${skills_section}` 等原样保留），叠加破甲层（人格锚定、注入防御反转、思维链约束）。\n- `README.md` — 设计说明、特色与用法。\n\n## 使用\n按 `README.md` 将 `SYSTEM.md` 部署为 Kimi Code 的 system prompt（或按研究需要引用其结构）。\n"}, {"name": "macho-analyze", "cat": "triage", "catLabel": "🔎 通用侦查 · 分诊", "star": false, "oneliner": "Mach-O 静态分诊：macOS/iOS 可执行文件 / dylib / bundle", "desc": "Static triage of Mach-O binaries (macOS/iOS executables, dylibs, bundles, kexts) with macholib: arch/fat slices, file type, PIE, linked dylibs, RPATH, code-signature presence, and encryption (LC_ENCRYPTION_INFO). Emits BINARY.* atoms. Reads structure only — never runs the binary.", "bytes": 1977, "human": "1.9 KB", "path": "/var/minis/skills/macho-analyze/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Mach-O Binary Analyzer\n\nStatic triage of Mach-O binaries (macOS/iOS executables, `.dylib`, bundles, kexts)\nwith [macholib](https://github.com/ronaldoussoren/macholib).\n\n## When to use\n\nYou have a macOS/iOS binary and want a fast read on what it is and whether it looks\nsuspicious — without running it. This completes the PE/ELF/Mach-O triage trio and\nemits `BINARY.*` atoms for downstream analysis.\n\n## What it reports\n\nPer architecture slice (Mach-O can be fat/universal):\n\n- **Header** — CPU/arch, file type (EXECUTE/DYLIB/BUNDLE/KEXT…), PIE (`BINARY.NO_PIE`).\n- **Linked dylibs** — every `LC_LOAD_DYLIB`, classified for network/crypto frameworks\n  (`BINARY.INTERESTING_LINK`).\n- **RPATH** — `LC_RPATH` entries (`@rpath` dylib-hijack surface) → `BINARY.RPATH`.\n- **Signature** — `LC_CODE_SIGNATURE` presence → `BINARY.NO_SIGNATURE` when absent.\n- **Encryption** — `LC_ENCRYPTION_INFO` with `cryptid` set (protector/DRM, the Mach-O\n  packing tell) → `BINARY.ENCRYPTED`.\n\nStrictly **static** — parses load commands via macholib and never loads, maps, or\nexecutes the binary. Safe on hostile files.\n\n## Usage\n\n```bash\nrekit run macho-analyze ./suspicious.dylib\nrekit run macho-analyze /path/to/app.app/Contents/MacOS/app --format json\n```\n\nNon-Mach-O input fails honestly (`{\"ok\": false, \"error\": \"not a valid Mach-O: …\"}`).\n\n## Prerequisites\n\n- **python3 ≥ 3.8** — macholib is installed under `scripts/site` (pure-python), so no\n  network/install at analysis time.\n\n## Rebuilding\n\n`scripts/site` is populated from the pinned `scripts/requirements.txt` by\n`scripts/build.sh` (`uv pip install --target`, build time only).\n"}, {"name": "malware-dynamic-analysis", "cat": "malware", "catLabel": "🦠 恶意代码 · 检测规则", "star": false, "oneliner": "隔离 VM 行为分析（执行后的动态侧）", "desc": "Behavioral analysis of a sample executed in an isolated VM. Use after triage when runtime behavior, C2 traffic, dropped files, persistence, or injection must be observed. Claude produces a tailored VM runbook from triage predictions, then parses the exported text evidence (Procmon CSV, Sysmon JSON/CSV, tshark output, autoruns, strings) on the host to reconstruct behavior and extract IOCs. The analyst runs the VM; Claude never executes the sample.", "bytes": 19642, "human": "19.2 KB", "path": "/var/minis/skills/malware-dynamic-analysis/SKILL.md", "subdirs": ["references", "scripts"], "files": ["SOURCE.md"], "body": "# Malware Dynamic Analysis\n\nTwo halves. **Part A** is a runbook the analyst follows inside the isolated VM (REMnux / FlareVM); you tailor it from triage predictions and it ends with text-format evidence exports. **Part B** is your work: parse that evidence on the host, reconstruct what the sample did, extract behavioral IOCs, and write findings to `analysis_state.md`.\n\n## Execution Model\n\n- **You never execute the sample.** The VM is network-isolated and has no Claude in it. Everything you run is on the host against exported evidence files.\n- **Locate skill files.** Scripts and reference files ship in this skill's directory. Set `R=\"${CLAUDE_PLUGIN_ROOT:-<dir containing this SKILL.md>}\"` once (when installed as a plugin `$CLAUDE_PLUGIN_ROOT` is set; otherwise it is this skill folder). Your working directory is the user's analysis workspace, so prefix every script path below with `$R`, e.g. `python3 \"$R\"/scripts/ioc_extract.py`.\n- **Before the VM run:** read the triage findings in `analysis_state.md` and emit a runbook tailored to the predictions (which process names to filter, which Sysmon event IDs matter, expected protocol, expected persistence, expected evasion). Skip the tailoring only if triage is missing — then use the default runbook as-is.\n- **After the VM run:** the user hands you an evidence directory. Inventory it, reject binary formats with the conversion command (see **Converting Binary Evidence**), and then work through Part B with Bash and the bundled scripts. Do not ask the user to summarize the evidence for you.\n- **Scripts** (relative to this skill dir): `scripts/procmon_summary.py`, `scripts/sysmon_summary.py`; plus `../scripts/ioc_extract.py` at repo root. All stdlib Python 3.\n- **Sandbox reports count as evidence.** ANY.RUN / Joe Sandbox / Hybrid An\n\n…（完整内容见 SKILL.md）"}, {"name": "malware-triage", "cat": "malware", "catLabel": "🦠 恶意代码 · 检测规则", "star": true, "oneliner": "恶意样本快速静态分诊 / 分级 / 优先级（样本到手第一步）", "desc": "Rapid static assessment, classification, and prioritization of malware samples. Use for the first look at any unknown file — hashes, file type, packing, imports, strings, initial IOCs, threat level, and the decision on which deep-analysis phase comes next. Claude runs the static tooling on the host itself; the sample is never executed.", "bytes": 13726, "human": "13.4 KB", "path": "/var/minis/skills/malware-triage/SKILL.md", "subdirs": ["references", "scripts"], "files": ["SOURCE.md"], "body": "# Malware Triage\n\nFirst phase for every sample. You run static tools on the host, interpret the output, classify the sample, and decide the next phase. Target: 5-15 minutes per sample.\n\n## Execution Model\n\n- **You run the commands.** You have Bash. Execute every command in this skill yourself and interpret the output. Do not ask the user to run tools or paste results unless a tool is missing and cannot be installed.\n- **Locate skill files.** Scripts and reference files ship in this skill's directory. Set `R=\"${CLAUDE_PLUGIN_ROOT:-<dir containing this SKILL.md>}\"` once (when installed as a plugin `$CLAUDE_PLUGIN_ROOT` is set; otherwise it is this skill folder). Your working directory is the user's analysis workspace, so prefix every script path below with `$R`, e.g. `python3 \"$R\"/scripts/ioc_extract.py`.\n- **Never execute the sample.** Only static tools touch it: `file`, `strings`, `pe_info.py`, `upx -d`, `7z l`, hashing. No `chmod +x`, no `wine`, no `./sample`.\n- **Never upload the sample** to any service without explicit consent. Hash lookups are fine; file uploads are not.\n- **Script paths** are relative to this skill directory. From the repo/skill root: `malware-triage/scripts/pe_info.py`, `malware-triage/scripts/hash_calculator.py`, `scripts/ioc_extract.py`. Resolve them from wherever this SKILL.md lives.\n- **Tool check first.** Run once per session; note what is missing and degrade rather than stop:\n  ```bash\n  command -v file strings upx 7z yara; python3 -c \"import pefile\" 2>&1 | tail -1\n  # pefile missing -> pip install pefile   (needed by pe_info.py)\n  ```\n- **Big outputs:** never `cat` a strings dump. Save to a file, `wc -l`, then `grep`/`head`.\n- **Ask the user only for:** the sample path, context (where it came from, incident ID, anything already known), and \n\n…（完整内容见 SKILL.md）"}, {"name": "minis-400-guard", "cat": "misc", "catLabel": "🆕 其他", "star": false, "oneliner": "Minis 会话 400 错误的预防、检测与自愈（两类：A=tool_calls 粘死 / B=上下文超限）。当用户或会话提到「400」「too", "desc": "Minis 会话 400 错误的预防、检测与自愈（两类：A=tool_calls 粘死 / B=上下文超限）。当用户或会话提到「400」「tool_calls 报错」「insufficient tool messages」「maximum context length」「上下文超限」「对话卡死/发消息没反应」「那个会话不回了」「压缩对话」「修复400」「400又出现了」，或需要巡检此类问题时触发。Use for any Minis session 400 or stuck-chat issue (tool_calls / context overflow), or when asked to prevent/detect/fix them.", "bytes": 10258, "human": "10.0 KB", "path": "/var/minis/skills/minis-400-guard/SKILL.md", "subdirs": [], "files": [], "body": "# Minis 400 防护与自愈（minis-400-guard）v2\n\n## 0. 两条流水线（先定类型，再动手）\n\n| | 类型 A：tool_calls 粘死 | 类型 B：上下文超限 |\n|---|---|---|\n| 报文 | `assistant message with 'tool_calls' must be followed by tool messages` | `maximum context length is N tokens. However, you requested M` |\n| 现象 | 会话彻底不回；重启 App 前反复失败 | 发送后 app 重试 `retry 1/3..3/3` 全失败；**对超限会话重启无效** |\n| 根因 | 图片类工具结果插入 tool 序列中间（批内多图/不在末位）；失败字节缓存于进程内被重放 | 模型组 `contextLimitTokens` 失效（超大值/null）→ 自动压缩阈值不可达 → 历史涨过服务商硬顶；App 记账比服务商**少算 ≈13%** |\n| 修法 | 重启 App（清缓存）+ 续跑注入 | **发一条新消息（续跑）** → App 重建有效上下文（实测 948K→444K）恢复正常；配置侧把组上限改 800000 |\n| 验证 | check 显示 OK + 会话有新回合 | check RC=2；会话出现健康 assistant 回复 |\n\n**一键处置**：\n```sh\nminis400heal check     # 两类全查（A 类 + B-STUCK/B-NOREPLY/B-RISK/CFG）\nminis400heal fix       # 自动修（A=预约续跑+必要时重启链；B=预约续跑+配置修复）\n```\n退出码：`0`=有发现（或已修）/ `2`=全健康 / `1`=错误。**巡检先用 check，有发现再 fix。**\n\n## 1. A 类机制（2026-09-19 破案，保留）\n带图工具结果（`read_image`、`browser_use` screenshot、任何产出图片字节的工具）**不在批次末位**或**一批多图** → 图片消息被插进 tool 消息序列中间 → 400。\n失败回合的图片字节缓存在 **App 进程内存**里，该会话之后每次请求都会重放 → **不重启 App 进程就永久卡死**。\n恢复 = 清缓存（重启 App）+ 注入一条新消息唤醒（`minis400heal fix` 自动做）。\n**预防铁律：任何图片类工具每批最多一个、且必须放最后；多图拆多个回合。**\n\n## 2. B 类机制（2026-09-21 反编译实证，V1.13）\n\n### 2.1 阈值模型（类 `m3.c` ContextPolicy，构造函数 `g4.H1.Q(limit)`）\n| limit 档 | offloadThreshold | offloadTarget | compactThreshold | exhaustedOnly | manualCompactAllowed |\n|---|---|---|---|---|---|\n| <32K | 0 | 0 | 0 | true | false |\n| 32–64K | limit-10K | limit-15K | 0 | true | true |\n| 64–128K | limit-20K | limit-30K | limit-10K | false | true |\n| ≥128K | limit-40K | limit-60K | **limit-20K** | false | true |\n\n…（完整内容见 SKILL.md）"}, {"name": "mobile-cert-pinning-bypass", "cat": "mobile", "catLabel": "📱 移动安全评估", "star": true, "oneliner": "证书绑定绕过总法：抓包被挡先读它（SSL handshake 失败信号）", "desc": "Bypass TLS certificate pinning so you can proxy a mobile app's traffic. Load when a proxy shows no/broken traffic, you see SSL handshake failures in logs, OkHttp CertificatePinner, TrustKit, or \"the app won't connect through Burp\". Android/iOS.", "bytes": 2123, "human": "2.1 KB", "path": "/var/minis/skills/mobile-cert-pinning-bypass/SKILL.md", "subdirs": [], "files": [], "body": "# Certificate pinning bypass\n\n## When it applies\nThe app pins its server cert, so a normal MITM proxy (Burp/mitmproxy) can't decrypt its\ntraffic — you get handshake errors and empty history. You need to test the backend, so the pin\nhas to go.\n\n## Why it works\nPinning is enforced in the client you control. At runtime you can replace/neutralize the\nverification routine; statically you can patch it out. Either way the app then trusts your\nproxy's CA.\n\n## Method\n1. **Install your CA** first: add Burp/mitmproxy CA to the device (Android 7+ needs it as a\n   *system* cert, or use a `network_security_config` on a repackaged app).\n2. **Runtime (fastest)**: `objection -g <pkg> explore` then `android sslpinning disable`\n   (iOS: `ios sslpinning disable`), or a Frida script (`frida-multiple-unpinning`).\n3. **Static patch** (when Frida is blocked): `apktool d`, remove/patch the `CertificatePinner`\n   / TrustManager checks or swap `network_security_config` to trust user CAs, rebuild + resign\n   (`apktool b`, `uber-apk-signer`).\n4. **Confirm**: traffic now appears decrypted in the proxy; proceed to backend testing.\n\n## Gotchas\n- No traffic at all (not just pinning) can mean the app uses a non-HTTP protocol or a VPN — check.\n- Some apps double-pin or detect Frida/root — combine root-detection bypass, or use static patching.\n- iOS on a non-jailbroken device needs a repackaged/sideloaded app or a jailbroken test device.\n\n## Verify success\nThe proxy shows plaintext requests/responses from the app; you can now replay/modify them.\n\n## References\nOWASP MASTG (network); objection & frida-multiple-unpinning; TrustKit/OkHttp docs.\n"}, {"name": "mobile-security-suite", "cat": "mobile", "catLabel": "📱 移动安全评估", "star": false, "oneliner": "移动安全评估套件：12 维度 / MASVS 检查表 / 威胁建模", "desc": "移动应用安全评估套件（12 维度）：认证/加密/安全存储/网络/平台交互/韧性（反调试·root·完整性）/隐私/代码质量/MASVS 检查表/威胁建模/测试计划/安全开发。当用户要求评估移动应用安全性、审计 APK/IPA、按 MASVS/MASTG 检查、梳理移动漏洞面时使用。", "bytes": 1728, "human": "1.7 KB", "path": "/var/minis/skills/mobile-security-suite/SKILL.md", "subdirs": ["references"], "files": [], "body": "# 移动安全评估套件（12 维度）\n\n每个维度一份独立指南，位于 `references/<维度>/SKILL.md`：\n\n| 维度 | 入口 |\n|---|---|\n| 认证评估 | `references/auth-assessment/SKILL.md` |\n| 加密审查 | `references/crypto-review/SKILL.md` |\n| 安全存储 | `references/secure-storage-audit/SKILL.md` |\n| 网络安全 | `references/network-security-check/SKILL.md` |\n| 平台交互 | `references/platform-interaction-review/SKILL.md` |\n| 韧性（反调试/root/完整性） | `references/resilience-assessment/SKILL.md` |\n| 隐私 | `references/privacy-audit/SKILL.md` |\n| 代码质量 | `references/code-quality-scan/SKILL.md` |\n| MASVS 检查表 | `references/masvs-checklist/SKILL.md` |\n| 威胁建模 | `references/mobile-threat-model/SKILL.md` |\n| 测试计划 | `references/mobile-pentest-plan/SKILL.md` |\n| 安全开发 | `references/secure-mobile-dev-guide/SKILL.md` |\n\n## 用法\n\n1. 先定位评估维度（可多选），打开对应 `references/<维度>/SKILL.md` 执行。\n2. 动态测试与绕过（Frida/脱壳/SSL pinning）配套技能：\n   - `android-native-auto-reverse`（全能逆向入口）\n   - `android-pt`（OWASP MASVS 全流程）\n   - `rev-cronet-ssl`（Cronet 原生层 pinning）\n3. 本机工具链：frida 插桩见 `/var/minis/shared/self/frida-kit/README.md`（`ensure-frida` + `fhook`）。\n"}, {"name": "native-decompile", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "原生二进制 → 类 C 伪代码（r2ghidra / r2 系）", "desc": "Decompile a native binary (ELF/PE/Mach-O) to C-like pseudocode with rizin's built-in Ghidra decompiler (pdg over all functions). Static: analyses and decompiles, never runs the target. Prereq-gated on rizin/r2; honest blind spot with an install hint when absent. Pair with elf/pe/macho-analyze.", "bytes": 1387, "human": "1.4 KB", "path": "/var/minis/skills/native-decompile/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Native Decompiler\n\nDecompile a native binary (ELF / PE / Mach-O) to C-like pseudocode with\n[rizin](https://rizin.re)'s built-in Ghidra decompiler.\n\n## When to use\n\nA native executable/library you need to read past the disassembly. Triage with\n`elf`/`pe`/`macho-analyze` first (arch, imports, packing), then decompile.\n\n## What it does\n\nRuns `rizin -q -c \"aaa; pdg @@F\" <input>` — analyse everything, then decompile every\nfunction with rizin's built-in Ghidra decompiler (`pdg`) — and writes the pseudocode\nto `outdir/decompiled.c`. Static: rizin analyses and decompiles; it never runs or\nemulates the target.\n\n## Prerequisites\n\n- **python3** (runner) and **`rizin`** (or `r2`) on PATH. rizin is a large native\n  toolchain, so it is **not bundled** — install from <https://rizin.re>. Its `pdg`\n  gives you Ghidra-quality decompilation without a separate Ghidra/JVM install. Until\n  it's present, `doctor` marks the skill not-ready and `run` reports the honest gap.\n\n## Usage\n\n```bash\nrekit run native-decompile ./suspicious.elf ./out\n```\n"}, {"name": "native-disassemble", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "PE/ELF/Mach-O → 面向函数的反汇编", "desc": "Disassemble PE, ELF, or Mach-O binaries to function-oriented assembly without executing them. Automatically uses llvm-objdump/objdump, then falls back to Rizin/radare2 analysis for stripped binaries. Writes the complete listing to disassembly.txt and reports instruction/function-line counts.", "bytes": 2406, "human": "2.3 KB", "path": "/var/minis/skills/native-disassemble/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Native Disassembler\n\nTurn a PE, ELF, or Mach-O executable or library into a complete assembly listing\nwithout running it. This is the lightweight read-side tool between structural triage\n(`pe-analyze`, `elf-analyze`, `macho-analyze`) and C-like decompilation\n(`native-decompile`).\n\n## What it does\n\nThe runner validates the input container, selects the first available backend, and\nwrites `disassembly.txt` atomically:\n\n1. `llvm-objdump -d -C`\n2. `objdump -d -C`\n3. `rizin -q -c \"aaa; pdf @@F\"`\n4. `r2 -q -c \"aaa; pdf @@F\"`\n\nObjdump is preferred because it is direct and fast. Rizin/radare2 is the fallback\nwhen analyzed function recovery is more useful, especially on stripped binaries.\nAll backends are invoked with argument arrays, color is disabled, and execution is\ntimeout-bounded. The target is parsed and disassembled only; it is never loaded as a\nprocess, emulated, or executed.\n\n## Usage\n\n```bash\nrekit run native-disassemble ./sample.exe ./out\nrekit run native-disassemble ./sample.elf ./out --format json\nrekit run native-disassemble ./sample.elf ./out --tool rizin\nrekit run native-disassemble ./sample.elf ./out --timeout 300\n```\n\nThe JSON result is a compact summary containing the selected backend, detected file\nformat, output path, byte count, function-label count, and instruction-line count.\nThe potentially large assembly listing always stays in `out/disassembly.txt`.\n\n## Prerequisites\n\n- **Python 3.8+** for the pure-stdlib runner.\n- One disassembler on `PATH`: `llvm-objdump`, `objdump`, `rizin`, or `r2`.\n\nLLVM/GNU objdump is normally supplied by LLVM, Xcode Command Line Tools, or binutils.\nRizin and radare2 are optional heavier fallbacks; no Ghidra or Java runtime is needed.\n\n## Boundaries\n\n…（完整内容见 SKILL.md）"}, {"name": "native-lift", "cat": "static", "catLabel": "⚙️ 静态分析 · 反编译", "star": false, "oneliner": "机器码区间 lift 到 LLVM IR（x86/amd64/aarch64）", "desc": "Lift a bounded raw x86, amd64, or aarch64 machine-code region into LLVM IR or bitcode with pinned Remill. Use for semantic analysis of an isolated function, shellcode, or decoder stub. Static and offline: never executes the bytes; rejects whole executable containers.", "bytes": 3662, "human": "3.6 KB", "path": "/var/minis/skills/native-lift/SKILL.md", "subdirs": ["scripts"], "files": ["SOURCE.md"], "body": "# Native Code Lifter\n\nLift one bounded raw machine-code region into LLVM IR or bitcode using Remill. This\nadds an instruction-semantics representation between Rekit's assembly listing and its\ndecompilation or emulation tools.\n\n## When to use\n\nUse `native-lift` for an extracted function, decoder stub, shellcode region, or a\nsmall compiler-output fixture when you want explicit register and memory semantics.\nThe skill accepts at most 64 KiB and requires the architecture and virtual address.\n\nDo not pass an ELF, PE, or Mach-O file. Remill's example trace lifter does not recover\na whole program, its loader, imports, or complete interprocedural control flow. Use\n`native-disassemble`, `native-decompile`, or `ghidra-decompile` for complete native\ncontainers. A future Anvill or McSema integration would be a separate capability.\n\n## Install\n\nThe pinned Remill and LLVM runtime is intentionally not built on the analysis host.\nInstall the published multi-platform image explicitly:\n\n```bash\nrekit install native-lift\nrekit doctor native-lift\n```\n\nInstallation pulls the immutable image and therefore uses the network. Analysis never\npulls or builds an image; it fails clearly when Docker, the daemon, the expected image,\nor the runtime health check is unavailable.\n\n## Usage\n\n```bash\nrekit run native-lift ./function.bin ./out --arch amd64 --address 0x401000\nrekit run native-lift ./stub.bin ./out --arch aarch64 --emit both --format json\n```\n\nInputs are `x86`, `amd64`, or `aarch64`; representative OS choices are `linux`,\n`macos`, `windows`, and `solaris`. The entry address defaults to the base address and\nmust point inside the supplied region. The default timeout is 300 seconds and may be\nset from 1 through 3600 seconds.\n\n…（完整内容见 SKILL.md）"}, {"name": "offensive-active-directory", "cat": "offensive", "catLabel": "⚔️ 漏洞利用 · 红队", "star": false, "oneliner": "内网 Active Directory 攻击方法论（红队内网）", "desc": "Active Directory attack methodology for internal network red team engagements. Covers reconnaissance (BloodHound, PowerView, ADExplorer), credential abuse (Kerberoasting, ASREProasting, NTLM relay, LLMNR
