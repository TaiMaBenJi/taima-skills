<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMNI · 技能中心</title>
<style>
:root{
  --bg0:#070b18; --bg1:#0e1531; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.13); --txt:#e9edff; --dim:#9aa3c7; --acc:#7dd3fc; --acc2:#c4b5fd; --warn:#fca5a5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--txt);overflow:hidden;
  font:15px/1.65 -apple-system,'HarmonyOS Sans SC','Noto Sans SC',system-ui,'Segoe UI',sans-serif}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1100px 750px at 88% -12%, rgba(124,58,237,.30), transparent 62%),
  radial-gradient(950px 700px at -12% 18%, rgba(6,182,212,.24), transparent 62%),
  radial-gradient(900px 900px at 50% 125%, rgba(244,114,182,.15), transparent 65%),
  linear-gradient(180deg,var(--bg0),var(--bg1))}
header{position:relative;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.brand{font-size:19px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand .logo{display:inline-block;filter:drop-shadow(0 0 10px rgba(125,211,252,.8))}
.brand em{font-style:normal;font-weight:500;font-size:13px;color:var(--dim);margin-left:8px}
#stats{font-size:12.5px;color:var(--dim);white-space:nowrap}
#q{flex:1;min-width:220px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--glass);color:var(--txt);font-size:14px;outline:none;transition:.2s}
#q:focus{border-color:rgba(125,211,252,.55);background:rgba(125,211,252,.08);
  box-shadow:0 0 0 3px rgba(125,211,252,.12)}
#q::placeholder{color:#6b76a3}
main{position:relative;z-index:1;display:grid;grid-template-columns:330px 1fr;
  height:calc(100% - 61px)}
nav{overflow-y:auto;border-right:1px solid var(--line);padding:10px 10px 40px;
  background:rgba(8,12,28,.45);backdrop-filter:none}
nav .grp{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.4px;
  margin:14px 8px 6px;position:sticky;top:0;padding:6px 0 4px;
  background:linear-gradient(180deg,rgba(10,14,32,.96),rgba(10,14,32,.75));z-index:1}
nav .it{display:block;width:100%;text-align:left;padding:8px 11px;margin:2px 0;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;
  font-size:13.5px;line-height:1.35;transition:.15s;font-family:inherit}
nav .it:hover{background:var(--glass)}
nav .it.on{background:linear-gradient(135deg,rgba(125,211,252,.20),rgba(196,181,253,.16));
  border-color:rgba(125,211,252,.35)}
nav .it .nm{font-weight:600}
nav .it .st{color:#fbbf24}
nav .it .mini{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .empty{color:var(--dim);font-size:13px;padding:16px 10px;display:none}
article{overflow-y:auto;padding:26px 30px 80px;scroll-behavior:smooth}
.welcome h2{font-size:22px;margin-bottom:6px}
.welcome p{color:var(--dim);font-size:13.5px;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  font-size:12.5px;color:var(--txt);cursor:pointer;transition:.15s}
.chip:hover{background:var(--glass2);border-color:rgba(125,211,252,.4)}
.starsec h3{font-size:15px;margin:18px 0 10px;color:var(--acc)}
details.star{border:1px solid var(--line);border-radius:14px;background:var(--glass);margin:8px 0;overflow:hidden}
details.star summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;list-style:none}
details.star summary::-webkit-details-marker{display:none}
details.star summary::after{content:'▾';float:right;color:var(--dim);transition:.2s}
details.star[open] summary::after{transform:rotate(180deg)}
details.star .bd{padding:0 16px 16px;border-top:1px solid var(--line)}
.skillhead{margin-bottom:6px}
.crumb{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.crumb b{color:var(--acc)}
h1.sk{font-size:23px;margin:2px 0 8px;line-height:1.3;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px;align-items:center}
.badge{padding:3px 11px;border-radius:999px;font-size:12px;border:1px solid var(--line);
  background:var(--glass);color:var(--dim)}
.badge.cat{color:#0b1020;background:linear-gradient(135deg,#7dd3fc,#c4b5fd);border:none;font-weight:600}
.badge.path{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim)}
.oneliner{font-size:14px;color:#c9d2f5;border-left:3px solid rgba(125,211,252,.6);
  padding:8px 14px;margin:14px 0 6px;background:rgba(125,211,252,.06);border-radius:0 10px 10px 0}
.desc{font-size:13px;color:var(--dim);margin:10px 0 18px}
.md{font-size:14px}
.md h2,.md h3,.md h4,.md h5,.md h6{margin:20px 0 8px;line-height:1.4;color:#dfe6ff}
.md h2{font-size:18px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.md h3{font-size:16px;color:var(--acc)}
.md h4,.md h5,.md h6{font-size:14.5px}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0 8px 22px}
.md li{margin:3px 0}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:rgba(148,163,255,.13);padding:1.5px 6px;border-radius:6px;color:#bae6fd;word-break:break-word}
.md pre{margin:12px 0;padding:14px 16px;border-radius:12px;overflow-x:auto;
  background:rgba(2,6,18,.75);border:1px solid var(--line)}
.md pre code{background:none;padding:0;color:#d7e3ff;font-size:12.5px;line-height:1.55;word-break:normal}
.md blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid rgba(196,181,253,.55);
  background:rgba(196,181,253,.07);color:#c9d2f5;border-radius:0 8px 8px 0}
.md hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.md table{border-collapse:collapse;margin:12px 0;font-size:13px;max-width:100%;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
.md th{background:rgba(125,211,252,.10);color:#cfe8ff}
.md a,.md .a{color:var(--acc);text-decoration:none;border-bottom:1px dotted rgba(125,211,252,.5)}
.md b{color:#f1f5ff}
#top{position:fixed;right:18px;bottom:18px;z-index:5;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(14,21,49,.85);color:var(--txt);font-size:17px;
  cursor:pointer;display:none}
@media(max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,38vh) minmax(0,1fr)}
  nav{border-right:none;border-bottom:1px solid var(--line)}
  article{padding:18px 16px 70px}
  header{gap:8px;padding:10px 12px}
  #q{min-width:150px}
  .brand em{display:none}
}
</style>
</head>
<body>
<div id="bg"></div>
<header>
  <div class="brand"><span class="logo">⚡</span>OMNI<em>技能中心 · 88 合 1</em></div>
  <div id="stats"></div>
  <input id="q" type="search" placeholder="搜索：名称 / 简介 / 全文…" autocomplete="off">
</header>
<main>
  <nav id="nav"></nav>
  <article id="detail"></article>
</main>
<button id="top" onclick="document.getElementById('detail').scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const DATA = __OMNI_DATA__;
const META = __OMNI_META__;
const CAT_ORDER = ["meta","env","triage","static","lang","frida","debug","android","ios","mobile","malware","offensive","ctf","web","firmware","diff","misc"];
const nav = document.getElementById('nav');
const detail = document.getElementById('detail');
const q = document.getElementById('q');
let current = null;

document.getElementById('stats').textContent = META.total + ' 技能 · 生成于 ' + META.generated;

/* ---------- markdown lite ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inl(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<span class="a" title="'+'$2'+'">$1</span>');
  return s;
}
function renderTable(rows){
  const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  let head=null, body=[];
  for(const r of rows){
    if(/^\|[\s:|\-]+\|$/.test(r.replace(/\s/g,'')) || /^[\s:|\-]+$/.test(r)) continue;
    const c = cells(r);
    if(!head) head=c; else body.push(c);
  }
  let h='<table>';
  if(head) h+='<thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead>';
  h+='<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  return h;
}
function md(src){
  src = src.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');
  const L = src.split(/\r?\n/);
  let out=[], list=null, table=null;
  const closeList = ()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  const closeTable = ()=>{ if(table){ out.push(renderTable(table)); table=null; } };
  for(let i=0;i<L.length;i++){
    let ln = L[i];
    if(/^\s*```/.test(ln)){
      closeList(); closeTable();
      let buf=[]; i++;
      while(i<L.length && !/^\s*```/.test(L[i])){ buf.push(L[i]); i++; }
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln)){ closeList(); (table=table||[]).push(ln); continue; }
    closeTable();
    if(/^\s*$/.test(ln)){ closeList(); continue; }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ closeList(); out.push('<hr>'); continue; }
    let m = ln.match(/^(#{1,6})\s+(.*)$/);
    if(m){ closeList(); const lv=Math.min(m[1].length+1,6); out.push('<h'+lv+'>'+inl(m[2])+'</h'+lv+'>'); continue; }
    if(/^\s*[-*+]\s+/.test(ln)){
      if(list!=='ul'){ closeList(); out.push('<ul>'); list='ul'; }
      out.push('<li>'+inl(ln.replace(/^\s*[-*+]\s+/,''))+'</li>'); continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      if(list!=='ol'){ closeList(); out.push('<ol>'); list='ol'; }
      out.push('<li>'+inl(ln.replace(/^\s*\d+[.)]\s+/,''))+'</li>'); continue;
    }
    if(/^\s*>\s?/.test(ln)){ closeList(); out.push('<blockquote>'+inl(ln.replace(/^\s*>\s?/,''))+'</blockquote>'); continue; }
    closeList();
    out.push('<p>'+inl(ln)+'</p>');
  }
  closeList(); closeTable();
  return out.join('\n');
}

/* ---------- nav ---------- */
function buildNav(filter){
  filter = (filter||'').toLowerCase().trim();
  const kw = filter ? filter.split(/\s+/) : [];
  let shown = 0, html = '';
  for(const c of CAT_ORDER){
    const grp = DATA.filter(d => d.cat===c && (!kw.length || kw.every(k =>
      (d.name+' '+d.oneliner+' '+d.desc+' '+d.body).toLowerCase().includes(k))));
    if(!grp.length) continue;
    html += '<div class="grp">'+grp[0].catLabel+'（'+grp.length+'）</div>';
    for(const d of grp.sort((a,b)=>a.name.localeCompare(b.name))){
      shown++;
      html += '<button class="it'+(current===d.name?' on':'')+'" data-n="'+d.name+'">'+
        '<span class="nm">'+esc(d.name)+(d.star?' <span class="st">★</span>':'')+'</span>'+
        '<span class="mini">'+esc(d.oneliner)+'</span></button>';
    }
  }
  if(!shown) html = '<div class="empty" style="display:block">没有匹配的技能。试试更短的关键词，或用终端：<code>omni find</code></div>';
  nav.innerHTML = html;
  nav.querySelectorAll('.it').forEach(b => b.addEventListener('click', ()=>{ select(b.dataset.n); }));
}

/* ---------- detail ---------- */
function select(name){
  const d = DATA.find(x=>x.name===name);
  if(!d) return;
  current = name;
  location.hash = name;
  const assets = (d.subdirs.length||d.files.length)
    ? '<div class="desc">资源：'+ (d.subdirs.concat(d.files).slice(0,12).map(esc).join(' · ')) +'</div>' : '';
  detail.innerHTML =
    '<div class="skillhead">'+
      '<div class="crumb">OMNI · <b>'+esc(d.catLabel)+'</b> · '+META.total+' 个技能之一</div>'+
      '<h1 class="sk">'+esc(d.name)+(d.star?' <span style="color:#fbbf24">★</span>':'')+'</h1>'+
      '<div class="badges"><span class="badge cat">'+esc(d.catLabel)+'</span>'+
        '<span class="badge">'+d.human+'</span>'+
        '<span class="badge path">'+esc(d.path)+'</span></div>'+
      '<div class="oneliner">'+esc(d.oneliner)+'</div>'+
      (d.desc && d.desc!==d.oneliner ? '<div class="desc">'+esc(d.desc)+'</div>' : '')+
      assets+
    '</div><div class="md">'+md(d.body)+'</div>';
  detail.scrollTop = 0;
  buildNav(q.value);
  document.getElementById('top').style.display = 'block';
}

function welcome(){
  current = null;
  const stars = DATA.filter(d=>d.star);
  let chipHtml = '';
  for(const c of CAT_ORDER){
    const n = DATA.filter(d=>d.cat===c).length;
    if(n) chipHtml += '<button class="chip" data-cat="'+c+'">'+(DATA.find(d=>d.cat===c).catLabel)+' · '+n+'</button>';
  }
  let starHtml = '';
  for(const d of stars){
    starHtml += '<details class="star"><summary>⚡ '+esc(d.name)+' — '+esc(d.oneliner)+'</summary>'+
      '<div class="bd">'+md(d.body)+'</div></details>';
  }
  detail.innerHTML = '<div class="welcome"><h2>⚡ OMNI 技能中心</h2>'+
    '<p>'+META.total+' 个技能合为一体（全机最高优先级反汇编/逆向技能总控）。点击左侧任意技能查看详情与正文预览；全文用 <code>omni show</code> 或直接读 SKILL.md。数据：'+esc(META.root)+'</p>'+
    '<div class="chips">'+chipHtml+'</div>'+
    '<div class="starsec"><h3>★ 高频首选（点击展开）</h3>'+starHtml+'</div></div>';
  detail.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    const c=ch.dataset.cat;
    q.value = DATA.find(d=>d.cat===c).catLabel.replace(/^\S+\s/,'');
    buildNav(q.value);
  }));
  buildNav(q.value);
}

/* ---------- events ---------- */
let t=null;
q.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>buildNav(q.value),140); });
detail.addEventListener('scroll', ()=>{
  document.getElementById('top').style.display = detail.scrollTop>700 ? 'block':'none';
});
window.addEventListener('hashchange', ()=>{ if(location.hash.length>1) select(decodeURIComponent(location.hash.slice(1))); });

if(location.hash.length>1) select(decodeURIComponent(location.hash.slice(1)));
else welcome();
</script>
</body>
</html>
